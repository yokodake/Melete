<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melete plan editor</title>
<style>
  :root {
    --bg: #fbf8fb; --surface: #ffffff; --surface-2: #f3eef3; --line: #ddd5dd;
    --ink: #1d1b1e; --muted: #6a636b; --accent: #4a78b5; --warn: #b3261e; --warn-bg: #fdeceb;
    --chip: #e8def8; --chip-ink: #3a2e55;
    --c-open: #9875D6; --c-board: #D32F2F; --c-struc: #528DDD; --c-finger: #DD77AD;
    --c-sc: #E2701A; --c-flex: #EAC521; --c-other: #5CA37C; --c-none: #b9b1b9;
    --heat: 74, 120, 181;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141215; --surface: #1d1b1e; --surface-2: #262327; --line: #3a353b;
      --ink: #e8e0e8; --muted: #a59ea6; --accent: #7fa7d9; --warn: #f2b8b5; --warn-bg: #3a1d1b;
      --chip: #4a4063; --chip-ink: #e8def8;
      --c-open: #B79BE8; --c-board: #F2776A; --c-struc: #8CB8F0; --c-finger: #EE7BA4;
      --c-sc: #FF9D4D; --c-flex: #FFE066; --c-other: #8ED0A6; --c-none: #6b646c;
      --heat: 127, 167, 217;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--surface-2);
    border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px;
    align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
  button, select, label.file { font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  label.file input { display: none; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .fname { color: var(--muted); font-size: 13px; }
  main { padding: 16px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 48px 16px; text-align: center;
    color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .problems { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px; }
  .problems summary { cursor: pointer; font-weight: 600; }
  .problems li { margin: 2px 0; }
  .muted { color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: var(--c-none); }
  .dot.none { background: transparent; border: 1px solid var(--c-none); }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px;
    background: var(--chip); color: var(--chip-ink); }

  /* weekly view: a grid, one column per week and one row per day, so every Monday lines up with
     every other Monday; the grid scrolls sideways, the page down */
  .weeks { overflow-x: auto; padding-bottom: 6px; }
  .weekgrid { display: grid; grid-auto-flow: column; grid-auto-columns: 280px; column-gap: 12px;
    width: max-content; }
  .weekgrid > .cell { background: var(--surface-2); padding: 0 10px; min-width: 0; }
  .weekgrid > .whead { border-radius: 12px 12px 0 0; padding: 10px 10px 6px; font-weight: 600; }
  .weekgrid > .whead .wk { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .weekgrid > .last { border-radius: 0 0 12px 12px; padding-bottom: 10px; }
  .day { padding-top: 10px; }
  .day h2 { font-size: 13px; margin: 0 0 4px; padding-bottom: 4px; border-bottom: 1px solid var(--line);
    font-weight: 600; }
  .empty { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px;
    margin: 5px 0; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 13px; }
  .module { border: 1px solid var(--line); border-radius: 12px; padding: 4px 8px 6px; margin: 8px 0; }
  .module > .mname { font-weight: 600; padding: 4px 4px 2px; }
  .module > .mdesc { color: var(--muted); font-size: 12px; padding: 0 4px 2px; }
  .stations { margin: 4px 0 0 18px; padding: 0; color: var(--muted); font-size: 13px; }

  /* global view */
  .tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; max-height: calc(100vh - 150px);
    background: var(--surface); }
  table { border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 2; font-weight: 600;
    text-align: center; }
  thead th .wk { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  th.rowname, td.rowname { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; }
  thead th.rowname { z-index: 3; background: var(--surface-2); }
  td.rowname .in { display: flex; align-items: center; gap: 8px; }
  tr.group td { background: var(--surface-2); font-weight: 600; position: sticky; left: 0; }
  tr.group td .kind { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  td.v { text-align: center; min-width: 46px; font-variant-numeric: tabular-nums; }
  td.v.zero { color: var(--line); }
  td.total { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  /* planning metadata: phases as coloured bands, deload weeks shaded */
  .phase { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px;
    margin-left: 6px; color: var(--ink); }
  .ph0 { --ph: 74, 160, 150; } .ph1 { --ph: 120, 110, 200; } .ph2 { --ph: 190, 140, 60; }
  .ph3 { --ph: 200, 90, 120; } .ph4 { --ph: 90, 150, 80; } .ph5 { --ph: 100, 140, 200; }
  .phase[class*=ph] { background: rgba(var(--ph), .25); }
  .weekgrid > .whead[class*=ph] { box-shadow: inset 0 4px 0 rgba(var(--ph), .9); }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px;
    margin-left: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .wnote { color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; }
  .weekgrid > .cell.deload { background: color-mix(in srgb, var(--surface-2) 70%, var(--line)); }
  thead tr.phases th { font-size: 12px; padding: 2px 6px; }
  thead tr.phases th[class*=ph] { background: rgba(var(--ph), .3); }
  th.deload, td.deload { box-shadow: inset 0 0 0 9999px rgba(127, 127, 127, .12); }
  thead th.deload .wk::after { content: " · deload"; }
  .phaserow { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.4fr auto; gap: 6px; align-items: center; margin: 4px 0; }
  .phaserow input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; width: 100%; }

  /* editing */
  .edittools { display: inline-flex; gap: 6px; }
  .tools { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tools button, .day h2 button { font-size: 12px; padding: 1px 7px; border-radius: 6px; }
  .day h2 { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .card.bad { border-color: var(--warn); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
    padding: 16px; max-width: min(680px, 94vw); width: 100%; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 10px; font-size: 16px; }
  .form { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center; }
  .form > label { color: var(--muted); font-size: 13px; }
  .form input, .form select, .form textarea { font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; width: 100%; }
  .form input[type=checkbox] { width: auto; justify-self: start; }
  .form textarea { min-height: 80px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .form .span { grid-column: 1 / -1; }
  .form .sub { grid-column: 1 / -1; font-weight: 600; margin-top: 6px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .err { color: var(--warn); font-size: 13px; min-height: 1em; }
  .lib { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .lib section { background: var(--surface-2); border-radius: 12px; padding: 10px; }
  .lib h2 { font-size: 14px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .lib .row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; background: var(--surface);
    margin: 4px 0; border: 1px solid var(--line); }
  .lib .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib .row button { font-size: 12px; padding: 1px 7px; }
</style>
</head>
<body>
<header>
  <h1>Plan editor</h1>
  <label class="file">Open plan… <input id="file" type="file" accept=".json,application/json,text/plain"></label>
  <span class="fname" id="fname"></span>
  <span style="flex:1"></span>
  <div class="seg" role="group" aria-label="View">
    <button id="v-week" aria-pressed="true">Weekly</button>
    <button id="v-global" aria-pressed="false">Global</button>
    <button id="v-library" aria-pressed="false">Library</button>
  </div>
  <span class="edittools">
    <button id="e-new" title="Start an empty plan">New</button>
    <button id="e-edit" aria-pressed="false" title="Edit the plan">Edit</button>
    <button id="e-undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="e-redo" title="Redo (Ctrl+Y)">Redo</button>
    <button id="e-save" title="Download the plan file">Save</button>
  </span>
</header>
<main id="main">
  <div class="drop" id="drop">Drop a <code>melete-plan</code> .json here, or use <b>Open plan…</b><br>
    <span class="muted">Nothing leaves this page: the file is read in the browser.</span></div>
</main>
<script>
"use strict";

// ------------------------------------------------------------------ reading the file

/**
 * Plan files are JSON with two allowances for writing by hand, as the importer takes them:
 * // and /* *\/ comments, and trailing commas. Strip both outside strings, then parse.
 */
function parseLenient(text) {
  let out = "", i = 0, inString = false;
  while (i < text.length) {
    const c = text[i];
    if (inString) {
      out += c;
      if (c === "\\") { out += text[i + 1] ?? ""; i += 2; continue; }
      if (c === '"') inString = false;
      i++; continue;
    }
    if (c === '"') { inString = true; out += c; i++; continue; }
    if (c === "/" && text[i + 1] === "/") { while (i < text.length && text[i] !== "\n") i++; continue; }
    if (c === "/" && text[i + 1] === "*") { i += 2; while (i < text.length && !(text[i] === "*" && text[i + 1] === "/")) i++; i += 2; continue; }
    out += c; i++;
  }
  // Trailing commas: a comma followed only by whitespace before } or ].
  let cleaned = "", inStr = false;
  for (let j = 0; j < out.length; j++) {
    const c = out[j];
    if (inStr) { cleaned += c; if (c === "\\") { cleaned += out[++j]; } else if (c === '"') inStr = false; continue; }
    if (c === '"') { inStr = true; cleaned += c; continue; }
    if (c === ",") {
      let k = j + 1; while (k < out.length && /\s/.test(out[k])) k++;
      if (out[k] === "}" || out[k] === "]") continue;
    }
    cleaned += c;
  }
  return JSON.parse(cleaned);
}

const nameKey = s => String(s ?? "").trim().replace(/\s+/g, " ").toLowerCase();
const DAYS = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
const DAY_LABEL = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const CATEGORY_VAR = {
  OPEN_CLIMBING: "--c-open", BOARD_CLIMBING: "--c-board", STRUCTURED_CLIMBING: "--c-struc",
  FINGER_TRAINING: "--c-finger", STRENGTH_CONDITIONING: "--c-sc", FLEXIBILITY: "--c-flex",
  OTHER_ACTIVITY: "--c-other",
};
const normEnum = s => String(s ?? "").trim().toUpperCase().replace(/[\s-]+/g, "_");
function parseMode(raw) {
  const m = normEnum(raw);
  if (m === "REPS") return "REPETITIONS";
  if (m === "TIMED" || m === "TIMED_SETS") return "DURATION";
  return ["REPETITIONS", "DURATION", "REPEATERS", "ACTIVITY"].includes(m) ? m : null;
}

function parseDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s ?? "").trim());
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return isNaN(d) ? null : d;
}
const addDays = (d, n) => new Date(d.getTime() + n * 86400000);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dayMonth = d => `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
const iso = d => d.toISOString().slice(0, 10);
function isoWeek(d) {
  const t = new Date(d); const day = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - day + 3);
  const first = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - first) / 86400000 - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
}

/**
 * Resolves the file the way the app's check does, as far as a viewer needs: names to definitions,
 * each placement to what it holds, and every mistake in words.
 */
function resolve(file) {
  const problems = [];
  if (file.format !== "melete-plan") problems.push(`"format" is ${JSON.stringify(file.format)}; the importer wants "melete-plan".`);
  if (file.version !== 1) problems.push(`"version" is ${JSON.stringify(file.version)}; the importer reads version 1.`);

  const known = new Set(["format", "version", "exercises", "circuits", "modules", "weeks", "benchmarks", "phases"]);
  Object.keys(file).filter(k => !known.has(k)).forEach(k => problems.push(`Unknown top-level key "${k}".`));

  function index(list, kind) {
    const map = new Map();
    (list ?? []).forEach((item, i) => {
      if (!item?.name || !String(item.name).trim()) { problems.push(`${kind} ${i + 1} has no name.`); return; }
      const key = nameKey(item.name);
      if (map.has(key)) problems.push(`Two ${kind.toLowerCase()}s are called "${item.name}".`);
      map.set(key, item);
    });
    return map;
  }
  const exercises = index(file.exercises, "Exercise");
  const circuits = index(file.circuits, "Circuit");
  const modules = index(file.modules, "Module");

  exercises.forEach(ex => {
    if (!parseMode(ex.mode)) problems.push(`${ex.name}: ${ex.mode ? `unknown mode "${ex.mode}"` : "no mode"}.`);
    if (ex.category && !CATEGORY_VAR[normEnum(ex.category)]) problems.push(`${ex.name}: unknown category "${ex.category}".`);
    if (ex.unit && !ex.meaning) problems.push(`${ex.name}: "unit" needs a "meaning".`);
  });

  // References resolve against the file; anything else would have to be in the phone's library.
  const missing = new Set();
  function exerciseOf(name, where) {
    const ex = exercises.get(nameKey(name));
    if (!ex) missing.add(`"${name}" (${where}) is not defined in this file — it must already be in the library, or the import fails.`);
    return ex ?? { name, mode: null, category: null, plan: null, variations: [], external: true };
  }
  function planOf(ex, variation, own, where) {
    if (own) return own;
    if (variation) {
      const v = (ex.variations ?? []).find(v => String(v.tag ?? "").toUpperCase() === String(variation).toUpperCase());
      if (!v && !ex.external) problems.push(`${ex.name} has no variation "${variation}" (${where}).`);
      if (v?.plan) return v.plan;
    }
    return ex.plan ?? null;
  }

  const weeks = [];
  const seen = new Set();
  (file.weeks ?? []).forEach((week, i) => {
    const start = parseDate(week.weekStart);
    if (!start) { problems.push(`Week ${i + 1}: unreadable "weekStart" ${JSON.stringify(week.weekStart)}.`); return; }
    if (start.getUTCDay() !== 1) problems.push(`Week ${week.weekStart} does not start on a Monday.`);
    if (seen.has(iso(start))) problems.push(`Week ${week.weekStart} is written twice.`);
    seen.add(iso(start));
    const weekKeys = new Set(["weekStart", "deload", "note", "unscheduled", ...DAYS]);
    Object.keys(week).filter(k => !weekKeys.has(k)).forEach(k => problems.push(`Week ${week.weekStart}: unknown key "${k}".`));

    const slots = [{ key: "unscheduled", label: "Unscheduled", date: null, raw: week.unscheduled ?? [] },
      ...DAYS.map((d, n) => ({ key: d, label: `${DAY_LABEL[n]} ${dayMonth(addDays(start, n))}`, date: addDays(start, n), raw: week[d] ?? [] }))];
    const where = s => `${week.weekStart}, ${s.label}`;
    slots.forEach(slot => {
      // Each placed item keeps where it sits in the file, so the editor can change it there.
      slot.items = slot.raw.map((item, index) => {
        const ref = { week: i, day: slot.key, index };
        const resolved = (() => {
        const kinds = ["exercise", "circuit", "module", "activity"].filter(k => item[k] != null);
        if (kinds.length !== 1) { problems.push(`${where(slot)}: an item must be exactly one of exercise, circuit, module, activity.`); return null; }
        if (item.exercise) {
          const ex = exerciseOf(item.exercise, where(slot));
          return { kind: "exercise", ex, variation: item.variation ?? null, optional: !!item.optional, plan: planOf(ex, item.variation, item.plan, where(slot)) };
        }
        if (item.circuit) {
          if (item.rounds != null && item.rounds < 1) problems.push(`${where(slot)}: ${item.circuit} needs at least 1 round.`);
          const c = circuitItem(item.circuit, where(slot));
          // This week's rounds, when the placement gives them.
          if (item.rounds != null) { c.rounds = item.rounds; c.overridden = true; }
          return c;
        }
        if (item.module) {
          const mod = modules.get(nameKey(item.module));
          if (!mod) { missing.add(`Module "${item.module}" (${where(slot)}) is not defined in this file.`); return { kind: "module", name: item.module, entries: [] }; }
          // This week's plans for some of its exercises, by name, when the placement gives them.
          const own = new Map(Object.entries(item.plans ?? {}).map(([k, v]) => [nameKey(k), v]));
          const held = new Set((mod.entries ?? []).filter(e => e.exercise).map(e => nameKey(e.exercise)));
          own.forEach((_, k) => { if (!held.has(k)) problems.push(`${where(slot)}: ${mod.name} has no exercise "${k}" of its own to plan.`); });
          // And the ones it leaves out this week.
          const omitted = new Set((item.omit ?? []).map(nameKey));
          omitted.forEach(k => {
            if (!held.has(k)) problems.push(`${where(slot)}: ${mod.name} has no exercise "${k}" of its own to leave out.`);
            if (own.has(k)) problems.push(`${where(slot)}: "${k}" is both planned and left out.`);
          });
          return {
            kind: "module", name: mod.name, description: mod.description,
            entries: (mod.entries ?? []).filter(e => !(e.exercise && omitted.has(nameKey(e.exercise)))).map(e => e.circuit ? circuitItem(e.circuit, `module ${mod.name}`)
              : (() => { const ex = exerciseOf(e.exercise, `module ${mod.name}`);
                const override = own.get(nameKey(e.exercise));
                return { kind: "exercise", ex, variation: e.variation ?? null, overridden: !!override, optional: !!e.optional,
                  plan: override ?? planOf(ex, e.variation, e.plan, `module ${mod.name}`) }; })()),
          };
        }
        return { kind: "activity", name: item.activity, minutes: item.minutes ?? null };
        })();
        return resolved ? Object.assign(resolved, { ref }) : { kind: "invalid", ref, raw: item };
      });
    });
    weeks.push({ start, slots, index: i, deload: week.deload === true, note: week.note ?? null });
  });

  function circuitItem(name, where) {
    const c = circuits.get(nameKey(name));
    if (!c) { missing.add(`Circuit "${name}" (${where}) is not defined in this file.`); return { kind: "circuit", name, rounds: 1, stations: [] }; }
    return {
      kind: "circuit", name: c.name, category: c.category, rounds: c.rounds ?? 1,
      transitionSeconds: c.transitionSeconds ?? 0, roundRestSeconds: c.roundRestSeconds ?? 0,
      stations: (c.stations ?? []).map(s => {
        const ex = exerciseOf(s.exercise, `circuit ${c.name}`);
        return { ex, variation: s.variation ?? null, plan: planOf(ex, s.variation, s.plan, `circuit ${c.name}`) };
      }),
    };
  }

  weeks.sort((a, b) => a.start - b.start);

  // Phases: planning metadata, checked as the importer checks them. A week belongs to the phase
  // its first day falls in.
  const phases = [];
  (file.phases ?? []).forEach((ph, n) => {
    const name = String(ph?.name ?? "").trim();
    if (!name) { problems.push(`Phase ${n + 1} has no name.`); return; }
    const from = parseDate(ph.from), to = parseDate(ph.to);
    if (!from) { problems.push(`Phase ${name}: ${ph.from == null ? "no \"from\"" : `"${ph.from}" is not a date`}.`); return; }
    if (!to) { problems.push(`Phase ${name}: ${ph.to == null ? "no \"to\"" : `"${ph.to}" is not a date`}.`); return; }
    if (to < from) { problems.push(`Phase ${name} ends before it starts.`); return; }
    phases.push({ name, from, to, note: ph.note ?? null, index: n });
  });
  phases.sort((a, b) => a.from - b.from).forEach((ph, k) => { ph.color = k % 6; });
  phases.forEach((a, k) => {
    const b = phases[k + 1];
    if (b && b.from <= a.to) problems.push(`Phases ${a.name} and ${b.name} overlap (a warning in the app).`);
  });
  weeks.forEach(w => { w.phase = phases.find(ph => w.start >= ph.from && w.start <= ph.to) ?? null; });

  return { weeks, phases, problems: [...problems, ...missing], counts: {
    exercises: exercises.size, circuits: circuits.size, modules: modules.size, weeks: weeks.length,
  } };
}

// ------------------------------------------------------------------ plan summaries

function fmtSeconds(s) {
  if (s == null) return "";
  if (s < 60) return `${s} s`;
  if (s % 60 === 0 && s < 3600) return `${s / 60} m`;
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function planSummary(ex, plan, inCircuit) {
  const mode = parseMode(ex.mode);
  if (!plan) return ex.external ? "from the library" : "no plan";
  const parts = [];
  if (mode === "ACTIVITY") return plan.minutes ? `${plan.minutes} m` : "length not set";
  const sets = plan.sets ?? 1;
  let target = null;
  if (plan.repeater) target = `${plan.repeater.reps} × ${plan.repeater.workSeconds}${plan.repeater.restSeconds ? "/" + plan.repeater.restSeconds : ""}s`;
  else if (plan.reps != null) target = inCircuit ? `${plan.reps} reps` : `${plan.reps}`;
  else if (plan.seconds != null) target = fmtSeconds(plan.seconds);
  if (inCircuit) { if (target) parts.push(target); }
  else parts.push(target ? `${sets} × ${target}` : `${sets} ${sets === 1 ? "set" : "sets"}`);
  if (ex.unilateral) parts[parts.length - 1] = (parts[parts.length - 1] ?? "") + " per side";
  const tight = (x) => fmtSeconds(x).replace(" ", "");
  if (plan.repRestSeconds && inCircuit) parts.push(`${tight(plan.repRestSeconds)} between reps`);
  else if (plan.repRestSeconds) parts.push(`rest ${plan.restSeconds != null ? tight(plan.restSeconds) : "–"}/${tight(plan.repRestSeconds)}`);
  else if (!inCircuit && plan.restSeconds != null) parts.push(`rest ${fmtSeconds(plan.restSeconds)}`);
  if (plan.effort) parts.push(normEnum(plan.effort).toLowerCase().replace("_", " "));
  return parts.join(" · ");
}

function dot(category) {
  const v = category ? CATEGORY_VAR[normEnum(category)] : null;
  const el = document.createElement("span");
  el.className = "dot" + (v ? "" : " none");
  if (v) el.style.background = `var(${v})`;
  el.title = category ? normEnum(category).toLowerCase().replace(/_/g, " ") : "no category";
  return el;
}
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => k === "class" ? el.className = v : el.setAttribute(k, v));
  children.flat().forEach(c => c != null && el.append(c.nodeType ? c : document.createTextNode(c)));
  return el;
}

// ------------------------------------------------------------------ weekly view

/**
 * Everything the file says about one exercise as it is placed, for the hover tooltip: its kind,
 * the whole plan field by field, how it is measured, and its description and notes.
 */
function exerciseDetail(ex, plan, variation) {
  const lines = [ex.name + (variation ? ` [${String(variation).toUpperCase()}]` : "")];
  const mode = parseMode(ex.mode);
  lines.push([mode ? mode.toLowerCase() : (ex.external ? "from the library" : "no mode"),
    ex.category ? normEnum(ex.category).toLowerCase().replace(/_/g, " ") : null,
    ex.unilateral ? "unilateral" : null,
    ex.unit ? `${ex.unit}${ex.meaning ? " " + normEnum(ex.meaning).toLowerCase().replace(/_/g, " ") : ""}` : null,
  ].filter(Boolean).join(" · "));
  if (plan) {
    const p = [];
    if (mode === "ACTIVITY") p.push(plan.minutes != null ? `length ${plan.minutes} m` : "no length");
    else p.push(`${plan.sets ?? 1} ${(plan.sets ?? 1) === 1 ? "set" : "sets"}`);
    if (plan.reps != null) p.push(`${plan.reps} reps`);
    if (plan.seconds != null) p.push(`${fmtSeconds(plan.seconds)} per set`);
    if (plan.repeater) p.push(`repeater ${plan.repeater.reps} × ${plan.repeater.workSeconds} s on / ${plan.repeater.restSeconds ?? 0} s off`);
    if (plan.repRestSeconds) p.push(`${fmtSeconds(plan.repRestSeconds)} between reps`);
    if (plan.restSeconds != null) p.push(`rest ${fmtSeconds(plan.restSeconds)}`);
    if (plan.sideSwitchSeconds != null) p.push(`side switch ${fmtSeconds(plan.sideSwitchSeconds)}`);
    if (plan.plannedMinutes != null) p.push(`planned ${plan.plannedMinutes} m`);
    if (plan.effort) p.push(`effort ${normEnum(plan.effort).toLowerCase().replace("_", " ")}`);
    lines.push("Plan: " + p.join(", "));
  } else {
    lines.push("Plan: none");
  }
  if (variation) {
    const v = (ex.variations ?? []).find(v => String(v.tag ?? "").toUpperCase() === String(variation).toUpperCase());
    if (v?.notes) lines.push(`Variation notes: ${v.notes}`);
  }
  if (ex.description) lines.push(`Description: ${ex.description}`);
  if (ex.notes) lines.push(`Notes: ${ex.notes}`);
  return lines.join("\n");
}

function exerciseCard(item) {
  return h("div", { class: "card", title: exerciseDetail(item.ex, item.plan, item.variation) },
    h("div", { class: "top" }, dot(item.ex.category), h("span", { class: "name" }, item.ex.name),
      item.variation ? h("span", { class: "chip" }, String(item.variation).toUpperCase()) : null,
      item.optional ? h("span", { class: "chip" }, "optional") : null),
    h("div", { class: "sub" }, planSummary(item.ex, item.plan, false) + (item.overridden ? " · this week" : "")));
}
function circuitCard(item) {
  const shape = [`${item.rounds} ${item.rounds === 1 ? "round" : "rounds"}${item.overridden ? " this week" : ""}`,
    item.transitionSeconds ? `switch ${fmtSeconds(item.transitionSeconds)}` : null,
    item.roundRestSeconds ? `rest ${fmtSeconds(item.roundRestSeconds)}` : null].filter(Boolean).join(" · ");
  return h("div", { class: "card" },
    h("div", { class: "top" }, dot(item.category), h("span", { class: "name" }, item.name), h("span", { class: "muted" }, "circuit")),
    h("div", { class: "sub" }, shape),
    h("ol", { class: "stations" }, item.stations.map(s => h("li", { title: exerciseDetail(s.ex, s.plan, s.variation) },
      `${s.ex.name}${s.variation ? " [" + s.variation + "]" : ""} — ${planSummary(s.ex, s.plan, true)}`))));
}
function itemNode(item) {
  if (item.kind === "invalid") return h("div", { class: "card bad" },
    h("div", { class: "top" }, h("span", { class: "name" }, "Unreadable item")),
    h("div", { class: "sub" }, JSON.stringify(item.raw)));
  if (item.kind === "exercise") return exerciseCard(item);
  if (item.kind === "circuit") return circuitCard(item);
  if (item.kind === "activity") return h("div", {
      class: "card",
      title: `${item.name}\none-off activity, no library entry\n${item.minutes != null ? `Length: ${item.minutes} m` : "No length"}`,
    },
    h("div", { class: "top" }, dot(null), h("span", { class: "name" }, item.name), h("span", { class: "muted" }, "activity")),
    h("div", { class: "sub" }, item.minutes ? `${item.minutes} m` : "no length"));
  return h("div", { class: "module" }, h("div", { class: "mname", title: item.description ? `${item.name}\n${item.description}` : item.name }, item.name),
    item.description ? h("div", { class: "mdesc" }, item.description) : null,
    item.entries.length ? item.entries.map(itemNode) : h("div", { class: "empty" }, "No entries."));
}

let state = { plan: null, view: "week", fileName: "", file: null, header: "", editing: false, past: [], future: [] };

function renderWeek(main) {
  const { weeks } = state.plan;
  if (state.editing) main.append(h("p", { class: "tools" },
    Editor.button("+ Add a week", () => Editor.addWeek()),
    Editor.button("Phases…", () => Editor.editPhases())));
  if (!weeks.length) { main.append(h("p", { class: "muted" }, "This file plans no weeks.")); return; }
  // One grid row per slot, shared by every week, so a row is as tall as its busiest week and the
  // days line up across columns. Unscheduled gets a row only if some week uses it.
  const withUnscheduled = state.editing || weeks.some(w => w.slots[0].items.length);
  const rows = 1 + (withUnscheduled ? 1 : 0) + 7;
  const grid = h("div", { class: "weekgrid" });
  grid.style.gridTemplateRows = `repeat(${rows}, auto)`;
  weeks.forEach(week => {
    const end = addDays(week.start, 6);
    const shade = week.deload ? " deload" : "";
    grid.append(h("div", { class: "cell whead" + shade + (week.phase ? ` ph${week.phase.color}` : "") },
      `${dayMonth(week.start)} – ${dayMonth(end)}`,
      h("span", { class: "wk" }, `W${isoWeek(week.start)} · ${end.getUTCFullYear()}`),
      h("div", {},
        week.phase ? h("span", { class: `phase ph${week.phase.color}`, title: week.phase.note ?? week.phase.name }, week.phase.name) : null,
        week.deload ? h("span", { class: "badge" }, "deload") : null),
      week.note ? h("div", { class: "wnote" }, week.note) : null,
      state.editing ? Editor.weekTools(week) : null));
    const slots = withUnscheduled ? week.slots : week.slots.slice(1);
    slots.forEach((slot, n) => {
      grid.append(h("div", { class: "cell day" + shade + (n === slots.length - 1 ? " last" : "") },
        h("h2", {}, slot.label, state.editing ? Editor.button("+", () => Editor.addItem(week, slot)) : null),
        slot.items.length ? slot.items.map(it => state.editing ? Editor.wrap(it, week, slot) : itemNode(it))
          : h("div", { class: "empty" }, "—")));
    });
  });
  main.append(h("div", { class: "weeks" }, grid));
}

// ------------------------------------------------------------------ global view

/**
 * One row per exercise and variation within the group it was placed through: a module, a circuit
 * placed on its own, standalone exercises, or one-off activities. An exercise and its variation are
 * different rows, since their sets are different work. A cell is that week's occurrences weighted by
 * sets against the row's heaviest: the most sets it ever has counts 1, so 4 sets = 1 and a 2-set
 * deload week = ½. Circuit stations count their circuit's rounds as sets.
 */
function buildTable() {
  const { weeks } = state.plan;
  const groups = new Map(); // key -> { title, kind, rows: Map(rowKey -> row) }
  function row(groupKey, title, kind, rowKey, label, category, ex = null) {
    if (!groups.has(groupKey)) groups.set(groupKey, { title, kind, rows: new Map() });
    const g = groups.get(groupKey);
    if (!g.rows.has(rowKey)) g.rows.set(rowKey, { label, category, ex, perWeek: new Map(), maxSets: 0, tags: new Set() });
    return g.rows.get(rowKey);
  }
  function count(r, weekIndex, sets, tag) {
    const list = r.perWeek.get(weekIndex) ?? [];
    list.push(sets); r.perWeek.set(weekIndex, list);
    r.maxSets = Math.max(r.maxSets, sets);
    if (tag) r.tags.add(String(tag).toUpperCase());
  }
  const setsOf = (ex, plan) => parseMode(ex.mode) === "ACTIVITY" ? 1 : Math.max(1, plan?.sets ?? 1);
  const keyOf = (ex, variation) => nameKey(ex.name) + (variation ? "|" + String(variation).toUpperCase() : "");
  function place(item, weekIndex, groupKey, title, kind) {
    if (item.kind === "exercise") {
      count(row(groupKey, title, kind, keyOf(item.ex, item.variation), item.ex.name, item.ex.category, item.ex), weekIndex, setsOf(item.ex, item.plan), item.variation);
    } else if (item.kind === "circuit") {
      const g = groupKey ?? `circuit:${nameKey(item.name)}`;
      const t = title ?? item.name;
      item.stations.forEach(s => count(
        row(g, t, kind ?? "circuit", keyOf(s.ex, s.variation), s.ex.name, s.ex.category, s.ex), weekIndex, Math.max(1, item.rounds), s.variation));
    } else if (item.kind === "activity") {
      count(row("activities", "One-off activities", "", nameKey(item.name), item.name, null), weekIndex, 1, null);
    } else {
      item.entries.forEach(e => place(e, weekIndex, `module:${nameKey(item.name)}`, item.name, "module"));
    }
  }
  weeks.forEach((w, wi) => w.slots.forEach(slot => slot.items.forEach(item => {
    if (item.kind === "exercise") place(item, wi, "standalone", "Standalone exercises", "");
    else place(item, wi, null, null, null);
  })));
  // Standalone exercises by category, in the app's order, uncategorised last; file order within.
  const standalone = groups.get("standalone");
  if (standalone) {
    const order = Object.keys(CATEGORY_VAR);
    const rankOf = r => { const i = order.indexOf(normEnum(r.category)); return i < 0 ? order.length : i; };
    standalone.rows = new Map([...standalone.rows.entries()].sort((a, b) => rankOf(a[1]) - rankOf(b[1])));
  }
  // Modules first, then circuits, then standalone, then activities. Modules and circuits go
  // alphabetically, so a deload version ("FA · deload") sits right under its module ("FA").
  // Within a standalone exercise, its base row comes before its variations.
  const rank = k => k.startsWith("module:") ? 0 : k.startsWith("circuit:") ? 1 : k === "standalone" ? 2 : 3;
  groups.forEach(g => {
    const entries = [...g.rows.entries()];
    const first = new Map();
    entries.forEach(([k], i) => { const base = k.split("|")[0]; if (!first.has(base)) first.set(base, i); });
    entries.sort((a, b) => {
      const [ab, av = ""] = a[0].split("|"), [bb, bv = ""] = b[0].split("|");
      return ab === bb ? av.localeCompare(bv) : first.get(ab) - first.get(bb);
    });
    g.rows = new Map(entries);
  });
  return [...groups.entries()]
    .sort((a, b) => rank(a[0]) - rank(b[0]) ||
      (rank(a[0]) <= 1 ? a[1].title.localeCompare(b[1].title, undefined, { sensitivity: "base" }) : 0))
    .map(([, g]) => g);
}

/** a/b reduced, shown as a whole number, a mixed fraction with a unicode glyph when one fits, or a/b. */
const GLYPH = { "1/2": "½", "1/3": "⅓", "2/3": "⅔", "1/4": "¼", "3/4": "¾", "1/5": "⅕", "2/5": "⅖", "3/5": "⅗", "4/5": "⅘", "1/6": "⅙", "5/6": "⅚", "1/8": "⅛", "3/8": "⅜", "5/8": "⅝", "7/8": "⅞" };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function fraction(num, den) {
  if (num === 0) return "·";
  const g = gcd(num, den); num /= g; den /= g;
  if (den === 1) return String(num);
  const whole = Math.floor(num / den), rest = num % den;
  const part = GLYPH[`${rest}/${den}`] ?? `${rest}/${den}`;
  return whole ? `${whole}${GLYPH[`${rest}/${den}`] ? "" : " "}${part}` : part;
}

function renderGlobal(main) {
  const { weeks } = state.plan;
  if (!weeks.length) { main.append(h("p", { class: "muted" }, "This file plans no weeks.")); return; }
  main.append(h("p", { class: "legend" },
    "Each cell: occurrences that week, weighted by sets against the row's most (1 = its fullest week's sets). " +
    "Circuit stations count rounds as sets. Hover a cell for the sets."));
  const groups = buildTable();
  // A row of phase bands over the weeks they cover, when the plan names any.
  const bands = [];
  weeks.forEach(w => {
    const last = bands[bands.length - 1];
    if (last && last.phase === w.phase) last.span++;
    else bands.push({ phase: w.phase, span: 1 });
  });
  const phaseRow = state.plan.phases?.length ? h("tr", { class: "phases" }, h("th", { class: "rowname" }, "Phase"),
    bands.map(b => h("th", { colspan: b.span, class: b.phase ? `ph${b.phase.color}` : "", title: b.phase?.note ?? "" }, b.phase?.name ?? "")),
    h("th", {})) : null;
  const thead = h("thead", {}, phaseRow, h("tr", {}, h("th", { class: "rowname" }, "Exercise"),
    weeks.map(w => h("th", { class: w.deload ? "deload" : "", title: w.note ?? "" }, dayMonth(w.start), h("span", { class: "wk" }, `W${isoWeek(w.start)}`))),
    h("th", {}, "Total")));
  const tbody = h("tbody");
  groups.forEach(g => {
    tbody.append(h("tr", { class: "group" }, h("td", { colspan: weeks.length + 2 }, g.title, g.kind ? h("span", { class: "kind" }, g.kind) : null)));
    g.rows.forEach(r => {
      let totalNum = 0;
      const cells = weeks.map((_, wi) => {
        const sets = r.perWeek.get(wi) ?? [];
        const num = sets.reduce((a, b) => a + b, 0);
        totalNum += num;
        const td = h("td", { class: "v" + (num ? "" : " zero") + (weeks[wi].deload ? " deload" : "") }, fraction(num, r.maxSets));
        if (num) {
          const value = num / r.maxSets;
          td.style.background = `rgba(var(--heat), ${Math.min(0.12 + 0.28 * value, 0.7)})`;
          td.title = `${sets.length} × (${sets.join(", ")} sets)`;
        }
        return td;
      });
      tbody.append(h("tr", {},
        h("td", { class: "rowname", title: r.ex ? exerciseDetail(r.ex, r.ex.plan ?? null, null) : r.label }, h("span", { class: "in" }, dot(r.category), r.label,
          r.tags.size ? h("span", { class: "chip" }, [...r.tags].join(" ")) : null)),
        cells, h("td", { class: "total" }, fraction(totalNum, r.maxSets))));
    });
  });
  main.append(h("div", { class: "tablewrap" }, h("table", {}, thead, tbody)));
}

// ------------------------------------------------------------------ shell

function render() {
  const main = document.getElementById("main");
  main.replaceChildren();
  if (!state.plan) { main.append(dropZone); Editor.updateHeader(); return; }
  const { problems, counts } = state.plan;
  main.append(h("p", { class: "muted", style: "margin-top:0" },
    `${counts.exercises} exercises · ${counts.circuits} circuits · ${counts.modules} modules · ${counts.weeks} weeks`));
  if (problems.length) {
    const d = h("details", { class: "problems" }, h("summary", {}, `${problems.length} problem${problems.length === 1 ? "" : "s"} the importer would report`),
      h("ul", {}, problems.map(p => h("li", {}, p))));
    d.open = problems.length <= 6;
    main.append(d);
  }
  if (state.view === "week") renderWeek(main);
  else if (state.view === "global") renderGlobal(main);
  else Editor.renderLibrary(main);
  document.getElementById("v-week").setAttribute("aria-pressed", state.view === "week");
  document.getElementById("v-global").setAttribute("aria-pressed", state.view === "global");
  document.getElementById("v-library").setAttribute("aria-pressed", state.view === "library");
  Editor.updateHeader();
}

function load(name, text) {
  state.fileName = name;
  document.getElementById("fname").textContent = name;
  try {
    const file = parseLenient(text);
    state.file = file;
    // The comment lines at the top of the file, kept so saving does not lose them.
    state.header = (text.match(/^(\s*\/\/[^\n]*\n)+/) ?? [""])[0].trim();
    state.past = []; state.future = [];
    state.plan = resolve(file);
  } catch (e) {
    state.file = null;
    state.plan = { weeks: [], problems: [`Not readable JSON: ${e.message}`], counts: { exercises: 0, circuits: 0, modules: 0, weeks: 0 } };
  }
  render();
}

// ------------------------------------------------------------------ editing

/**
 * The editor works on the file itself (state.file), never on the resolved view: every change is
 * made to the JSON the importer reads, then the whole file is resolved again, so the weeks, the
 * table and the problem list always describe exactly what Save would write.
 */
const Editor = (() => {
  const DRAFT_KEY = "melete-plan-editor-draft";
  const EFFORTS = ["", "VERY_EASY", "EASY", "MODERATE", "HARD", "VERY_HARD"];
  const MODES = ["REPETITIONS", "DURATION", "REPEATERS", "ACTIVITY"];
  const CATEGORIES = ["", ...Object.keys(CATEGORY_VAR)];
  const MEANINGS = ["", "TOTAL_LOAD", "ADDED_LOAD"];
  const clone = x => JSON.parse(JSON.stringify(x));

  function button(label, onClick, title) {
    const b = h("button", title ? { title } : {}, label);
    b.onclick = e => { e.stopPropagation(); onClick(); };
    return b;
  }

  // ---------------------------------------------------------------- history and saving

  /** Applies one change to the file, remembering the file as it was for Undo. */
  function change(fn) {
    if (!state.file) return;
    state.past.push(JSON.stringify(state.file));
    if (state.past.length > 200) state.past.shift();
    state.future = [];
    fn(state.file);
    refresh();
  }
  function refresh() {
    state.plan = resolve(state.file);
    saveDraft();
    render();
  }
  function undo() {
    if (!state.past.length) return;
    state.future.push(JSON.stringify(state.file));
    state.file = JSON.parse(state.past.pop());
    refresh();
  }
  function redo() {
    if (!state.future.length) return;
    state.past.push(JSON.stringify(state.file));
    state.file = JSON.parse(state.future.pop());
    refresh();
  }
  function text() {
    return (state.header ? state.header + "\n" : "") + JSON.stringify(state.file, null, 2) + "\n";
  }
  function save() {
    if (!state.file) return;
    const blob = new Blob([text()], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: state.fileName || "plan.json" });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  // A draft in this browser, so a closed tab does not lose an afternoon of edits.
  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ name: state.fileName, header: state.header, file: state.file, at: Date.now() })); } catch (e) { /* storage off */ }
  }
  function readDraft() {
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY) ?? "null"); } catch (e) { return null; }
  }
  function restoreDraft() {
    const d = readDraft(); if (!d?.file) return;
    state.fileName = d.name || "plan.json"; state.header = d.header ?? ""; state.file = d.file;
    state.past = []; state.future = []; state.editing = true;
    document.getElementById("fname").textContent = state.fileName + " (draft)";
    refresh();
  }
  function newPlan() {
    if (state.file && !confirm("Start an empty plan? The current one stays only in Undo until you load another file.")) return;
    if (state.file) state.past.push(JSON.stringify(state.file));
    state.file = { format: "melete-plan", version: 1, exercises: [], circuits: [], modules: [], weeks: [] };
    state.fileName = "plan.json"; state.header = ""; state.editing = true; state.future = [];
    document.getElementById("fname").textContent = state.fileName;
    refresh();
  }

  function updateHeader() {
    const has = !!state.file;
    const edit = document.getElementById("e-edit");
    edit.setAttribute("aria-pressed", state.editing);
    edit.disabled = !has;
    document.getElementById("e-undo").disabled = !state.past.length;
    document.getElementById("e-redo").disabled = !state.future.length;
    document.getElementById("e-save").disabled = !has;
  }

  // ---------------------------------------------------------------- dialogs

  /** A modal with a form; [onOk] returns an error message to keep it open, or nothing. */
  function dialog(title, body, onOk, okLabel = "Save") {
    const err = h("div", { class: "err" });
    const ok = h("button", {}, okLabel);
    const cancel = h("button", {}, "Cancel");
    const d = h("dialog", {}, h("h3", {}, title), body, err, h("div", { class: "actions" }, cancel, ok));
    document.body.append(d);
    cancel.onclick = () => { d.close(); d.remove(); };
    ok.onclick = () => {
      let message;
      try { message = onOk(); } catch (e) { message = e.message; }
      if (message) { err.textContent = message; return; }
      d.close(); d.remove();
    };
    d.addEventListener("cancel", () => d.remove());
    d.showModal();
    return d;
  }
  function form(...rows) { return h("div", { class: "form" }, rows); }
  function field(label, input) { return [h("label", {}, label), input]; }
  function input(value, attrs = {}) { const i = h("input", attrs); i.value = value ?? ""; return i; }
  function number(value) { return input(value, { type: "number", min: "0", step: "1" }); }
  function textarea(value) { const t = h("textarea", {}); t.value = value ?? ""; return t; }
  function checkbox(checked) { const c = h("input", { type: "checkbox" }); c.checked = !!checked; return c; }
  function select(options, value) {
    const s = h("select", {}, options.map(o => {
      const [v, l] = Array.isArray(o) ? o : [o, o === "" ? "—" : o.toLowerCase().replace(/_/g, " ")];
      return h("option", { value: v }, l);
    }));
    s.value = value ?? "";
    return s;
  }
  function list(id, names) { return h("datalist", { id }, names.map(n => h("option", { value: n }))); }
  const num = el => el.value.trim() === "" ? undefined : Number(el.value);
  function jsonOf(el, fallback) {
    const t = el.value.trim();
    if (!t) return fallback;
    return parseLenient(t);
  }
  // Drop undefined, empty strings and empty objects, so the file stays as short as it was.
  function tidy(o) {
    Object.keys(o).forEach(k => {
      const v = o[k];
      if (v === undefined || v === "" || v === null || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length)) delete o[k];
    });
    return o;
  }

  /** The plan fields: every one of them, filled from [plan]; read() gives the plan or undefined. */
  function planFields(plan) {
    plan = plan ?? {};
    const f = {
      sets: number(plan.sets), reps: number(plan.reps), seconds: number(plan.seconds),
      restSeconds: number(plan.restSeconds), repRestSeconds: number(plan.repRestSeconds),
      sideSwitchSeconds: number(plan.sideSwitchSeconds), minutes: number(plan.minutes),
      plannedMinutes: number(plan.plannedMinutes), effort: select(EFFORTS, plan.effort ? normEnum(plan.effort) : ""),
      rReps: number(plan.repeater?.reps), rWork: number(plan.repeater?.workSeconds), rRest: number(plan.repeater?.restSeconds),
    };
    const nodes = [
      ...field("Sets", f.sets), ...field("Reps", f.reps), ...field("Set length (s)", f.seconds),
      ...field("Rest between sets (s)", f.restSeconds), ...field("Rest between reps (s)", f.repRestSeconds),
      ...field("Side switch (s)", f.sideSwitchSeconds), ...field("Minutes (activity)", f.minutes),
      ...field("Planned minutes", f.plannedMinutes), ...field("Effort", f.effort),
      ...field("Repeater reps", f.rReps), ...field("Repeater on (s)", f.rWork), ...field("Repeater off (s)", f.rRest),
    ];
    function read() {
      const p = tidy({
        sets: num(f.sets), reps: num(f.reps), seconds: num(f.seconds), restSeconds: num(f.restSeconds),
        repRestSeconds: num(f.repRestSeconds), sideSwitchSeconds: num(f.sideSwitchSeconds), minutes: num(f.minutes),
        plannedMinutes: num(f.plannedMinutes), effort: f.effort.value || undefined,
        repeater: num(f.rReps) != null || num(f.rWork) != null
          ? tidy({ reps: num(f.rReps), workSeconds: num(f.rWork), restSeconds: num(f.rRest) }) : undefined,
      });
      return Object.keys(p).length ? p : undefined;
    }
    return { nodes, read };
  }

  // ---------------------------------------------------------------- week items

  function slotList(file, ref, create = false) {
    const week = file.weeks[ref.week];
    if (!week[ref.day]) { if (!create) return []; week[ref.day] = []; }
    return week[ref.day];
  }
  function dropEmptySlots(week) {
    ["unscheduled", ...DAYS].forEach(k => { if (Array.isArray(week[k]) && !week[k].length) delete week[k]; });
  }

  /** A placed item with its tools under it: move up or down, move elsewhere, edit, delete. */
  function wrap(item, week, slot) {
    const node = itemNode(item);
    const ref = item.ref;
    const count = slot.raw.length;
    node.append(h("div", { class: "tools" },
      button("↑", () => change(f => { const l = slotList(f, ref); if (ref.index > 0) [l[ref.index - 1], l[ref.index]] = [l[ref.index], l[ref.index - 1]]; }), "Up"),
      button("↓", () => change(f => { const l = slotList(f, ref); if (ref.index < count - 1) [l[ref.index + 1], l[ref.index]] = [l[ref.index], l[ref.index + 1]]; }), "Down"),
      button("Edit", () => editItem(ref)),
      button("Move", () => moveItem(ref)),
      button("Copy", () => change(f => { const l = slotList(f, ref); l.splice(ref.index + 1, 0, clone(l[ref.index])); }), "Duplicate in this day"),
      button("✕", () => change(f => { slotList(f, ref).splice(ref.index, 1); dropEmptySlots(f.weeks[ref.week]); }), "Delete"),
    ));
    return node;
  }

  function addItem(week, slot) {
    itemDialog(`Add to ${slot.label}, week of ${dayMonth(week.start)}`, { exercise: "" }, true, item => {
      change(f => slotList(f, { week: week.index, day: slot.key }, true).push(item));
    });
  }
  function editItem(ref) {
    const raw = slotList(state.file, ref)[ref.index];
    itemDialog("Edit item", clone(raw), false, item => change(f => { slotList(f, ref)[ref.index] = item; }));
  }

  /** The form for one placed item, shaped by its kind. */
  function itemDialog(title, raw, adding, onDone) {
    const file = state.file;
    const kind0 = ["exercise", "circuit", "module", "activity"].find(k => raw[k] != null) ?? "exercise";
    const kind = select(["exercise", "circuit", "module", "activity"], kind0);
    const name = input(raw[kind0] ?? "", { list: "names-" + kind0 });
    const lists = h("div", {},
      list("names-exercise", (file.exercises ?? []).map(e => e.name)),
      list("names-circuit", (file.circuits ?? []).map(c => c.name)),
      list("names-module", (file.modules ?? []).map(m => m.name)));
    const variation = select([""], raw.variation ?? "");
    const optional = checkbox(raw.optional);
    const ownPlan = checkbox(!!raw.plan);
    const plan = planFields(raw.plan);
    const rounds = number(raw.rounds);
    const omit = input((raw.omit ?? []).join(", "));
    const plans = textarea(raw.plans ? JSON.stringify(raw.plans, null, 2) : "");
    const minutes = number(raw.minutes);
    const extra = textarea(JSON.stringify(Object.fromEntries(Object.entries(raw).filter(([k]) =>
      !["exercise", "circuit", "module", "activity", "variation", "optional", "plan", "rounds", "omit", "plans", "minutes"].includes(k))), null, 2));

    function fillVariations() {
      const ex = (file.exercises ?? []).find(e => nameKey(e.name) === nameKey(name.value));
      const tags = (ex?.variations ?? []).map(v => String(v.tag ?? "").toUpperCase());
      const current = variation.value || raw.variation || "";
      variation.replaceChildren(...["", ...tags].map(t => h("option", { value: t }, t || "— default —")));
      if (current && !tags.includes(String(current).toUpperCase())) variation.append(h("option", { value: current }, current + " (not in this file)"));
      variation.value = current ? String(current).toUpperCase() : "";
      if (!variation.value && current) variation.value = current;
    }
    const groups = {
      exercise: [...field("Variation", variation), ...field("Optional", optional), ...field("Own plan this week", ownPlan),
        h("div", { class: "sub" }, "Plan (used when “own plan” is ticked)"), ...plan.nodes],
      circuit: [...field("Rounds this week", rounds)],
      module: [...field("Omit (names, comma-separated)", omit),
        h("div", { class: "sub" }, "Plans this week, by exercise name (JSON object)"), h("div", { class: "span" }, plans)],
      activity: [...field("Minutes", minutes)],
    };
    const body = h("div", {});
    function layout() {
      name.setAttribute("list", "names-" + kind.value);
      if (kind.value === "exercise") fillVariations();
      body.replaceChildren(lists, form(
        ...(adding ? field("Kind", kind) : []),
        ...field(kind.value === "activity" ? "Name" : "Name", name),
        ...groups[kind.value],
        h("div", { class: "sub" }, "Other fields (JSON, rarely needed)"), h("div", { class: "span" }, extra),
      ));
    }
    kind.onchange = layout;
    name.onchange = () => { if (kind.value === "exercise") fillVariations(); };
    layout();
    dialog(title, body, () => {
      const n = name.value.trim();
      if (!n) return "A name is needed.";
      const item = { [kind.value]: n };
      if (kind.value === "exercise") {
        if (variation.value) item.variation = variation.value;
        if (ownPlan.checked) { const p = plan.read(); if (p) item.plan = p; }
        if (optional.checked) item.optional = true;
      } else if (kind.value === "circuit") {
        if (num(rounds) != null) item.rounds = num(rounds);
      } else if (kind.value === "module") {
        const o = omit.value.split(",").map(x => x.trim()).filter(Boolean);
        if (o.length) item.omit = o;
        const p = jsonOf(plans, undefined);
        if (p && Object.keys(p).length) item.plans = p;
      } else if (num(minutes) != null) {
        item.minutes = num(minutes);
      }
      Object.assign(item, jsonOf(extra, {}));
      onDone(item);
    });
  }

  /** Moves an item to any day of any week, at the end. */
  function moveItem(ref) {
    const weeks = state.plan.weeks;
    const week = select(weeks.map(w => [String(w.index), `Week of ${dayMonth(w.start)} ${w.start.getUTCFullYear()}`]), String(ref.week));
    const day = select([["unscheduled", "Unscheduled"], ...DAYS.map((d, n) => [d, DAY_LABEL[n]])], ref.day);
    dialog("Move to", form(...field("Week", week), ...field("Day", day)), () => {
      const to = { week: Number(week.value), day: day.value };
      change(f => {
        const [item] = slotList(f, ref).splice(ref.index, 1);
        slotList(f, to, true).push(item);
        dropEmptySlots(f.weeks[ref.week]);
      });
    }, "Move");
  }

  // ---------------------------------------------------------------- weeks

  function weekTools(week) {
    return h("div", { class: "tools" },
      button(week.deload ? "Not deload" : "Deload", () => change(f => {
        const w = f.weeks[week.index];
        if (w.deload) delete w.deload; else w.deload = true;
      }), "Mark or unmark this as a deload week"),
      button("Note", () => editNote(week)),
      button("Copy to…", () => copyWeek(week)),
      button("Clear", () => { if (confirm(`Empty the week of ${dayMonth(week.start)}?`)) change(f => {
        const w = f.weeks[week.index];
        // The week's metadata stays; only its workouts go.
        f.weeks[week.index] = tidy({ weekStart: w.weekStart, deload: w.deload, note: w.note });
      }); }),
      button("Delete", () => { if (confirm(`Delete the week of ${dayMonth(week.start)}?`)) change(f => { f.weeks.splice(week.index, 1); }); }),
    );
  }
  function editNote(week) {
    const note = input(week.note ?? "");
    dialog(`Note for the week of ${dayMonth(week.start)}`, form(...field("Note", note)), () => {
      change(f => {
        const w = f.weeks[week.index];
        const t = note.value.trim();
        if (t) w.note = t; else delete w.note;
      });
    });
  }

  /** The plan's phases as rows of name, first day, last day and note. */
  function editPhases() {
    const rows = [];
    const box = h("div", {});
    function addRow(ph = {}) {
      const name = input(ph.name ?? "", { placeholder: "Name" });
      const from = input(ph.from ?? "", { type: "date" });
      const to = input(ph.to ?? "", { type: "date" });
      const note = input(ph.note ?? "", { placeholder: "Note" });
      const row = { name, from, to, note, extra: ph };
      const node = h("div", { class: "phaserow" }, name, from, to, note,
        button("✕", () => { rows.splice(rows.indexOf(row), 1); node.remove(); }));
      rows.push(row); box.append(node);
    }
    (state.file.phases ?? []).forEach(addRow);
    // Starting from the plan's weeks makes the first phase quick to fill in.
    if (!rows.length) {
      const ws = state.plan.weeks;
      addRow(ws.length ? { from: iso(ws[0].start), to: iso(addDays(ws[ws.length - 1].start, 6)) } : {});
    }
    dialog("Phases", h("div", {},
      h("div", { class: "phaserow muted" }, "Name", "First day", "Last day", "Note", ""),
      box,
      h("p", {}, button("+ Add a phase", () => addRow())),
      h("p", { class: "muted" }, "A week belongs to the phase its first day falls in. The app checks phases and ignores them."),
    ), () => {
      const out = rows.map(r => tidy(Object.assign({}, r.extra, {
        name: r.name.value.trim(), from: r.from.value || undefined, to: r.to.value || undefined,
        note: r.note.value.trim() || undefined,
      }))).filter(ph => ph.name || ph.from || ph.to);
      if (out.some(ph => !ph.name)) return "Every phase needs a name.";
      if (out.some(ph => !ph.from || !ph.to)) return "Every phase needs a first and a last day.";
      if (out.some(ph => ph.to < ph.from)) return "A phase cannot end before it starts.";
      change(f => {
        out.sort((a, b) => a.from.localeCompare(b.from));
        if (out.length) f.phases = out; else delete f.phases;
      });
    });
  }

  function addWeek() {
    const weeks = state.plan.weeks;
    const last = weeks.length ? weeks[weeks.length - 1].start : null;
    const today = new Date(); const monday = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
    monday.setUTCDate(monday.getUTCDate() - ((monday.getUTCDay() + 6) % 7));
    const start = input(iso(last ? addDays(last, 7) : monday), { type: "date" });
    dialog("Add a week", form(...field("Monday", start)), () => {
      const d = parseDate(start.value);
      if (!d || d.getUTCDay() !== 1) return "Pick a Monday.";
      if (weeks.some(w => iso(w.start) === iso(d))) return "That week is already in the plan.";
      change(f => { (f.weeks ??= []).push({ weekStart: iso(d) }); f.weeks.sort((a, b) => String(a.weekStart).localeCompare(String(b.weekStart))); });
    }, "Add");
  }
  /** Copies a week's contents onto the following weeks, creating them or replacing what is there. */
  function copyWeek(week) {
    const count = number(1);
    const from = input(iso(addDays(week.start, 7)), { type: "date" });
    const replace = checkbox(true);
    dialog(`Copy the week of ${dayMonth(week.start)}`, form(
      ...field("First week to fill", from), ...field("How many weeks", count), ...field("Replace their contents", replace),
      h("div", { class: "span muted" }, "Without “replace”, the copied items are added after what each week already holds."),
    ), () => {
      const first = parseDate(from.value);
      const n = num(count) ?? 1;
      if (!first || first.getUTCDay() !== 1) return "Pick a Monday.";
      if (n < 1 || n > 104) return "Between 1 and 104 weeks.";
      change(f => {
        const source = f.weeks[week.index];
        for (let k = 0; k < n; k++) {
          const start = iso(addDays(first, 7 * k));
          let target = f.weeks.find(w => w.weekStart === start);
          if (!target) { target = { weekStart: start }; f.weeks.push(target); }
          ["unscheduled", ...DAYS].forEach(key => {
            const items = clone(source[key] ?? []);
            if (replace.checked) { if (items.length) target[key] = items; else delete target[key]; }
            else if (items.length) target[key] = [...(target[key] ?? []), ...items];
          });
        }
        f.weeks.sort((a, b) => String(a.weekStart).localeCompare(String(b.weekStart)));
      });
    }, "Copy");
  }

  // ---------------------------------------------------------------- the library

  /** How many places name [name] as a [kind], so a deletion can say what it would break. */
  function usage(kind, name) {
    const key = nameKey(name); let n = 0;
    const f = state.file;
    const visit = item => { if (item && nameKey(item[kind]) === key) n++; };
    (f.weeks ?? []).forEach(w => ["unscheduled", ...DAYS].forEach(d => (w[d] ?? []).forEach(visit)));
    (f.circuits ?? []).forEach(c => (c.stations ?? []).forEach(visit));
    (f.modules ?? []).forEach(m => (m.entries ?? []).forEach(visit));
    return n;
  }
  /** Renames every reference to a renamed exercise, circuit or module across the file. */
  function rename(f, kind, from, to) {
    const key = nameKey(from);
    if (key === nameKey(to)) return;
    const fix = item => {
      if (!item) return;
      if (nameKey(item[kind]) === key) item[kind] = to;
      if (kind === "exercise" && item.module) {
        if (item.plans) item.plans = Object.fromEntries(Object.entries(item.plans).map(([k, v]) => [nameKey(k) === key ? to : k, v]));
        if (item.omit) item.omit = item.omit.map(o => nameKey(o) === key ? to : o);
      }
    };
    (f.weeks ?? []).forEach(w => ["unscheduled", ...DAYS].forEach(d => (w[d] ?? []).forEach(fix)));
    (f.circuits ?? []).forEach(c => (c.stations ?? []).forEach(fix));
    (f.modules ?? []).forEach(m => (m.entries ?? []).forEach(fix));
  }

  function renderLibrary(main) {
    if (!state.file) { main.append(h("p", { class: "muted" }, "Open a plan, or start a new one.")); return; }
    const f = state.file;
    const editing = state.editing;
    const section = (title, kind, items, describe, edit, make) => h("section", {},
      h("h2", {}, `${title} (${items.length})`, editing ? button("+ Add", () => edit(null)) : null),
      [...items].map((it, i) => [it, i]).sort((a, b) => String(a[0].name).localeCompare(String(b[0].name)))
        .map(([it, i]) => h("div", { class: "row", title: describe(it) },
          dot(it.category), h("span", { class: "name" }, it.name ?? "(no name)"),
          h("span", { class: "muted" }, String(usage(kind, it.name))),
          editing ? button("Edit", () => edit(i)) : null,
          editing ? button("✕", () => remove(make, kind, i)) : null)));
    main.append(h("p", { class: "legend" }, editing
      ? "The number is how many places use it. Renaming updates them; deleting leaves them pointing at nothing (shown as problems)."
      : "Turn on Edit to change the library. The number is how many places use each item."));
    main.append(h("div", { class: "lib" },
      section("Exercises", "exercise", f.exercises ?? [], it => exerciseDetail(it, it.plan, null), editExercise, "exercises"),
      section("Circuits", "circuit", f.circuits ?? [], it => `${it.rounds ?? 1} rounds · ${(it.stations ?? []).map(s => s.exercise).join(", ")}`, editCircuit, "circuits"),
      section("Modules", "module", f.modules ?? [], it => (it.entries ?? []).map(e => e.exercise ?? e.circuit).join(", "), editModule, "modules"),
    ));
  }
  function remove(listKey, kind, index) {
    const item = state.file[listKey][index];
    const used = usage(kind, item.name);
    if (!confirm(`Delete ${item.name}?` + (used ? ` It is used in ${used} place${used === 1 ? "" : "s"}, which will then point at nothing.` : ""))) return;
    change(f => f[listKey].splice(index, 1));
  }

  /** Writes [obj] at [index] of [listKey] (or adds it), renaming references when the name changed. */
  function store(listKey, kind, index, obj) {
    const names = (state.file[listKey] ?? []).filter((_, i) => i !== index).map(x => nameKey(x.name));
    if (!obj.name) return "A name is needed.";
    if (names.includes(nameKey(obj.name))) return `Another one is already called “${obj.name}”.`;
    change(f => {
      f[listKey] ??= [];
      if (index == null) f[listKey].push(obj);
      else { rename(f, kind, f[listKey][index].name, obj.name); f[listKey][index] = obj; }
    });
  }

  function editExercise(index) {
    const ex = index == null ? { name: "", mode: "REPETITIONS" } : clone(state.file.exercises[index]);
    const name = input(ex.name);
    const mode = select(MODES, parseMode(ex.mode) ?? "REPETITIONS");
    const category = select(CATEGORIES, ex.category ? normEnum(ex.category) : "");
    const unilateral = checkbox(ex.unilateral);
    const unit = input(ex.unit);
    const meaning = select(MEANINGS, ex.meaning ? normEnum(ex.meaning) : "");
    const description = textarea(ex.description); description.style.fontFamily = "inherit";
    const notes = input(ex.notes);
    const plan = planFields(ex.plan);
    const variations = textarea(ex.variations?.length ? JSON.stringify(ex.variations, null, 2) : "");
    dialog(index == null ? "New exercise" : `Edit ${ex.name}`, form(
      ...field("Name", name), ...field("Mode", mode), ...field("Category", category), ...field("Unilateral", unilateral),
      ...field("Unit", unit), ...field("Meaning", meaning), ...field("Description", description), ...field("Notes", notes),
      h("div", { class: "sub" }, "Default plan"), ...plan.nodes,
      h("div", { class: "sub" }, "Variations (JSON list of { tag, notes, plan })"), h("div", { class: "span" }, variations),
    ), () => {
      const out = Object.assign(ex, tidy({
        name: name.value.trim(), mode: mode.value, category: category.value || undefined,
        unilateral: unilateral.checked || undefined, unit: unit.value.trim() || undefined,
        meaning: meaning.value || undefined, description: description.value.trim() || undefined,
        notes: notes.value.trim() || undefined,
      }));
      ["category", "unilateral", "unit", "meaning", "description", "notes", "plan", "variations"].forEach(k => {
        if (out[k] === undefined) delete out[k];
      });
      if (!category.value) delete out.category;
      if (!unilateral.checked) delete out.unilateral;
      if (!unit.value.trim()) delete out.unit;
      if (!meaning.value) delete out.meaning;
      if (!description.value.trim()) delete out.description;
      if (!notes.value.trim()) delete out.notes;
      const p = plan.read(); if (p) out.plan = p; else delete out.plan;
      const v = jsonOf(variations, []); if (v.length) out.variations = v; else delete out.variations;
      return store("exercises", "exercise", index, out);
    });
  }

  function editCircuit(index) {
    const c = index == null ? { name: "", rounds: 1, stations: [] } : clone(state.file.circuits[index]);
    const name = input(c.name);
    const category = select(CATEGORIES, c.category ? normEnum(c.category) : "");
    const rounds = number(c.rounds ?? 1);
    const transition = number(c.transitionSeconds);
    const roundRest = number(c.roundRestSeconds);
    const stations = textarea(JSON.stringify(c.stations ?? [], null, 2));
    dialog(index == null ? "New circuit" : `Edit ${c.name}`, form(
      ...field("Name", name), ...field("Category", category), ...field("Rounds", rounds),
      ...field("Transition (s)", transition), ...field("Round rest (s)", roundRest),
      h("div", { class: "sub" }, "Stations (JSON list of { exercise, variation, plan })"), h("div", { class: "span" }, stations),
    ), () => {
      c.name = name.value.trim();
      if (category.value) c.category = category.value; else delete c.category;
      c.rounds = num(rounds) ?? 1;
      if (num(transition) != null) c.transitionSeconds = num(transition); else delete c.transitionSeconds;
      if (num(roundRest) != null) c.roundRestSeconds = num(roundRest); else delete c.roundRestSeconds;
      c.stations = jsonOf(stations, []);
      return store("circuits", "circuit", index, c);
    });
  }

  function editModule(index) {
    const m = index == null ? { name: "", entries: [] } : clone(state.file.modules[index]);
    const name = input(m.name);
    const description = textarea(m.description); description.style.fontFamily = "inherit";
    const entries = textarea(JSON.stringify(m.entries ?? [], null, 2));
    dialog(index == null ? "New module" : `Edit ${m.name}`, form(
      ...field("Name", name), ...field("Description", description),
      h("div", { class: "sub" }, "Entries (JSON list of { exercise, variation, plan, optional } or { circuit })"), h("div", { class: "span" }, entries),
    ), () => {
      m.name = name.value.trim();
      if (description.value.trim()) m.description = description.value.trim(); else delete m.description;
      m.entries = jsonOf(entries, []);
      return store("modules", "module", index, m);
    });
  }

  // ---------------------------------------------------------------- wiring

  document.getElementById("e-edit").onclick = () => { state.editing = !state.editing; render(); };
  document.getElementById("e-undo").onclick = undo;
  document.getElementById("e-redo").onclick = redo;
  document.getElementById("e-save").onclick = save;
  document.getElementById("e-new").onclick = newPlan;
  document.addEventListener("keydown", e => {
    if (document.querySelector("dialog[open]")) return;
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (e.key === "y" || (e.key === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
    else if (e.key === "s") { e.preventDefault(); save(); }
  });

  /** On an empty page, offers the draft left from last time. */
  function offerDraft(zone) {
    const d = readDraft();
    if (!d?.file) return;
    zone.append(h("div", { style: "margin-top:14px" },
      button(`Restore the unsaved draft (${d.name || "plan"}, ${new Date(d.at).toLocaleString()})`, restoreDraft)));
  }

  return { button, wrap, addItem, weekTools, addWeek, editPhases, renderLibrary, updateHeader, offerDraft };
})();

const dropZone = document.getElementById("drop");
Editor.updateHeader();
Editor.offerDraft(dropZone);
document.getElementById("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => load(f.name, t));
  e.target.value = "";
};
document.getElementById("v-week").onclick = () => { state.view = "week"; render(); };
document.getElementById("v-global").onclick = () => { state.view = "global"; render(); };
document.getElementById("v-library").onclick = () => { state.view = "library"; render(); };
document.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("over"); });
document.addEventListener("dragleave", () => dropZone.classList.remove("over"));
document.addEventListener("drop", e => {
  e.preventDefault(); dropZone.classList.remove("over");
  const f = e.dataTransfer.files[0]; if (f) f.text().then(t => load(f.name, t));
});
</script>
</body>
</html>
