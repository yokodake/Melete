    const g = planGrid(plan);
    const ex = exerciseNamed(exerciseName);
    const summary = plan ? (ex ? planSummary(ex, plan, false) : "own plan") : "default plan";
    return { node: h("details", { class: "rowplan" }, h("summary", {}, summary), g.node), read: g.read };
  }
  /** An exercise name with its variation list kept in step. */
  function exercisePick(name, variation) {
    const nameEl = input(name ?? "", { list: "names-exercise", placeholder: "Exercise" });
    const varEl = h("select", {});
    const fill = () => {
      const tags = tagsOf(nameEl.value);
      const current = varEl.value || (variation ? String(variation).toUpperCase() : "");
      varEl.replaceChildren(...["", ...tags].map(t => h("option", { value: t }, t || "default")));
      if (current && !tags.includes(current)) varEl.append(h("option", { value: current }, current + " ?"));
      varEl.value = current;
    };
    nameEl.addEventListener("change", fill);
    fill();
    return { nameEl, varEl };
  }
  const nameLists = () => h("div", {},
    list("names-exercise", namesOf("exercises")), list("names-circuit", namesOf("circuits")), list("names-module", namesOf("modules")));

  /** Save, revert and delete, and where an error is said. */
  function panelActions(kind, index, save) {
    const err = h("div", { class: "err" });
    const saveB = button(index === "new" ? "Add" : "Save", () => {
      let message;
      try { message = save(); } catch (e) { message = e.message; }
      if (message) err.textContent = message;
    });
    saveB.classList.add("primary");
    const bar = h("div", { class: "panelbar" }, err, h("span", { style: "flex:1" }),
      index === "new" ? null : button("Delete", () => {
        const listKey = KINDS[kind].list;
        const item = state.file[listKey][index];
        const used = usage(kind, item.name);
        if (!confirm(`Delete ${item.name}?` + (used ? ` It is used in ${used} place${used === 1 ? "" : "s"}, which will then point at nothing.` : ""))) return;
        lib.index = null; globalPick = null;
        change(f => f[listKey].splice(index, 1));
      }),
      button("Revert", () => render()),
      saveB);
    return bar;
  }
  /** Stores the edited item and keeps it selected under its (possibly new) name. */
  function storeAndSelect(kind, index, obj) {
    const listKey = KINDS[kind].list;
    const message = store(listKey, kind, index === "new" ? null : index, obj);
    if (message) return message;
    const i = state.file[listKey].indexOf(obj) >= 0 ? state.file[listKey].indexOf(obj)
      : state.file[listKey].findIndex(x => nameKey(x.name) === nameKey(obj.name));
    if (globalPick && globalPick.kind === kind) globalPick.index = i; else lib.index = i;
    render();
  }

  function exercisePanel(index, onClose) {
    const ex = index === "new" ? { name: "", mode: "REPETITIONS" } : clone(state.file.exercises[index]);
    const name = input(ex.name);
    const mode = select(MODES, parseMode(ex.mode) ?? "REPETITIONS");
    const category = select(CATEGORIES, ex.category ? normEnum(ex.category) : "");
    const unilateral = checkbox(ex.unilateral);
    const unit = input(ex.unit, { placeholder: "kg, s, cm…" });
    const meaning = select(MEANINGS, ex.meaning ? normEnum(ex.meaning) : "");
    const description = textarea(ex.description); description.classList.add("prose");
    const notes = input(ex.notes);
    const plan = planGrid(ex.plan);
    const variations = rowsEditor(ex.variations ?? [], v => {
      const tag = input(v.tag ?? "", { placeholder: "TAG", class: "tag" });
      const vnotes = input(v.notes ?? "", { placeholder: "Notes" });
      const p = rowPlan(v.plan, ex.name);
      return {
        node: h("div", { class: "rowmain" }, tag, vnotes, p.node),
        read: () => {
          const t = tag.value.trim().toUpperCase();
          if (!t) return null;
          return withPlan(tidy(Object.assign({}, v, { tag: t, notes: vnotes.value.trim() || undefined, plan: undefined })), p.read());
        },
      };
    }, "+ Variation", () => ({}));
    const json = jsonBox(ex);
    const save = () => {
      if (json.changed()) return storeAndSelect("exercise", index, json.read());
      const out = Object.assign(ex, {
        name: name.value.trim(), mode: mode.value,
        category: category.value || undefined, unilateral: unilateral.checked || undefined,
        unit: unit.value.trim() || undefined, meaning: meaning.value || undefined,
        description: description.value.trim() || undefined, notes: notes.value.trim() || undefined,
        plan: plan.read(),
      });
      const vs = variations.read();
      out.variations = vs.length ? vs : undefined;
      Object.keys(out).forEach(k => out[k] === undefined && delete out[k]);
      return storeAndSelect("exercise", index, out);
    };
    return h("div", { class: "panelform" }, nameLists(),
      h("h3", {}, index === "new" ? "New exercise" : ex.name, onClose && globalPick ? button("✕", onClose, "Close") : null),
      line(["Name", name, true], ["Mode", mode], ["Category", category]),
      line(["Unilateral", unilateral], ["Unit", unit], ["Meaning", meaning]),
      h("label", { class: "pair block" }, h("span", {}, "Description"), description),
      line(["Notes", notes, true]),
      h("div", { class: "sub" }, "Default plan"), plan.node,
      h("div", { class: "sub" }, "Variations"), variations.node,
      json.node,
      panelActions("exercise", index, save));
  }

  function circuitPanel(index, onClose) {
    const c = index === "new" ? { name: "", rounds: 1, stations: [] } : clone(state.file.circuits[index]);
    const name = input(c.name);
    const category = select(CATEGORIES, c.category ? normEnum(c.category) : "");
    const rounds = number(c.rounds ?? 1);
    const transition = number(c.transitionSeconds);
    const roundRest = number(c.roundRestSeconds);
    const stations = rowsEditor(c.stations ?? [], s => {
      const pick = exercisePick(s.exercise, s.variation);
      const p = rowPlan(s.plan, s.exercise);
      return {
        node: h("div", { class: "rowmain" }, pick.nameEl, pick.varEl, p.node),
        read: () => {
          const n = pick.nameEl.value.trim(); if (!n) return null;
          return withPlan(tidy(Object.assign({}, s, { exercise: n, variation: pick.varEl.value || undefined, plan: undefined })), p.read());
        },
      };
    }, "+ Station", () => ({}));
    const json = jsonBox(c);
    const save = () => {
      if (json.changed()) return storeAndSelect("circuit", index, json.read());
      Object.assign(c, { name: name.value.trim(), rounds: num(rounds) ?? 1 });
      if (category.value) c.category = category.value; else delete c.category;
      if (num(transition) != null) c.transitionSeconds = num(transition); else delete c.transitionSeconds;
      if (num(roundRest) != null) c.roundRestSeconds = num(roundRest); else delete c.roundRestSeconds;
      c.stations = stations.read();
      return storeAndSelect("circuit", index, c);
    };
    return h("div", { class: "panelform" }, nameLists(),
      h("h3", {}, index === "new" ? "New circuit" : c.name, onClose && globalPick ? button("✕", onClose, "Close") : null),
      line(["Name", name, true], ["Category", category]),
      line(["Rounds", rounds], ["Transition (s)", transition], ["Round rest (s)", roundRest]),
      h("div", { class: "sub" }, "Stations, in order (one set each per round)"), stations.node,
      json.node,
      panelActions("circuit", index, save));
  }

  function modulePanel(index, onClose) {
    const m = index === "new" ? { name: "", entries: [] } : clone(state.file.modules[index]);
    const name = input(m.name);
    const description = textarea(m.description); description.classList.add("prose");
    const entries = rowsEditor(m.entries ?? [], e => {
      const kind = select([["exercise", "exercise"], ["circuit", "circuit"]], e.circuit != null ? "circuit" : "exercise");
      const pick = exercisePick(e.exercise ?? e.circuit, e.variation);
      const optional = checkbox(e.optional);
      const optLabel = h("label", { class: "inline" }, optional, " optional");
      const p = rowPlan(e.plan, e.exercise);
      const sync = () => {
        const isEx = kind.value === "exercise";
        pick.nameEl.setAttribute("list", isEx ? "names-exercise" : "names-circuit");
        pick.nameEl.placeholder = isEx ? "Exercise" : "Circuit";
        [pick.varEl, optLabel, p.node].forEach(el => { el.style.display = isEx ? "" : "none"; });
      };

      return {
        node: h("div", { class: "rowmain" }, kind, pick.nameEl, pick.varEl, optLabel, p.node),
        read: () => {
          const n = pick.nameEl.value.trim(); if (!n) return null;
          if (kind.value === "circuit") return { circuit: n };
          const out = Object.assign({}, e, { exercise: n, variation: pick.varEl.value || undefined,
            optional: optional.checked || undefined, plan: undefined });
          delete out.circuit;
          return withPlan(tidy(out), p.read());
        },
      };
    }, "+ Entry", () => ({}));
    const json = jsonBox(m);
    const save = () => {
      if (json.changed()) return storeAndSelect("module", index, json.read());
      m.name = name.value.trim();
      if (description.value.trim()) m.description = description.value.trim(); else delete m.description;
      m.entries = entries.read();
      return storeAndSelect("module", index, m);
    };
    return h("div", { class: "panelform" }, nameLists(),
      h("h3", {}, index === "new" ? "New module" : m.name, onClose && globalPick ? button("✕", onClose, "Close") : null),
      line(["Name", name, true]),
      h("label", { class: "pair block" }, h("span", {}, "Description"), description),
      h("div", { class: "sub" }, "Entries, in order"), entries.node,

  /** Moves the keyboard into the panel: its first field. */
  function focusPanel() {
    requestAnimationFrame(() => document.querySelector("#libpanel input, #libpanel select, #libpanel textarea, #globalpanel input")?.focus());
  }
  function focusList() { document.getElementById("liblist")?.focus(); }

  /** Library keys, while the list (not a field) has the keyboard. */
  function libraryKey(e) {
    const items = visibleItems();
    const at = items.findIndex(x => x.i === lib.index);
    const cats = Object.keys(KINDS);
    const pick = i => { if (items[i]) { lib.index = items[i].i; render(); focusList(); } };
    switch (e.key) {
      case "ArrowDown": case "j": e.preventDefault(); pick(at < 0 ? 0 : Math.min(at + 1, items.length - 1)); return true;
      case "ArrowUp": case "k": e.preventDefault(); pick(at < 0 ? 0 : Math.max(at - 1, 0)); return true;
      case "ArrowRight": case "l": case "ArrowLeft": case "h": {
        e.preventDefault();
        const c = cats.indexOf(lib.cat) + (e.key === "ArrowRight" || e.key === "l" ? 1 : -1);
        if (cats[c]) { lib.cat = cats[c]; lib.index = null; render(); focusList(); }
        return true;
      }
      case "Enter": case "e": e.preventDefault(); if (lib.index != null) focusPanel(); return true;
      case "/": e.preventDefault(); document.getElementById("libfilter")?.focus(); return true;
      case "a": e.preventDefault(); lib.index = "new"; render(); focusPanel(); return true;
      case "Delete":
        e.preventDefault();
        if (lib.index != null && lib.index !== "new") document.querySelector("#libpanel .panelbar button:not(.primary)")?.click();
        return true;
    }
    return false;
  }

  /** The Global table's side panel: the exercise, circuit or module a click picked. */
  function globalPanel() {
    if (!globalPick) return null;
    const close = () => { globalPick = null; render(); };
    return h("div", { class: "libpanel", id: "globalpanel" }, panelFor(globalPick.kind, globalPick.index, close));
  }
  function pickInGlobal(kind, index) {
    if (index == null || index < 0) return;
    globalPick = { kind, index };
    render();
  }

  // ---------------------------------------------------------------- the board: selection, keys, drag

  /*
   * Everything placed in a week — an exercise, a circuit, a module, a one-off activity — is one
   * kind of thing here: selected, moved, copied, cut, pasted, dragged and deleted the same way. A
   * module's members and a circuit's stations belong to their group and are never picked alone.
   *
   * Positions: a "ref" is { week: index in file.weeks, day: "unscheduled" | weekday, index }; a
   * slot is the same without an index. The cursor is the position keys move from: an item, or an
   * empty slot (index null). Changes return the raw objects they produced, and the selection is
   * found again by identity once the file is resolved, so it follows what was moved or copied.
   */
  const SLOTS = ["unscheduled", ...DAYS];
  const board = {
    items: [],        // selected refs
    slot: null,       // a selected slot (paste/add target), or null
    cursor: null,     // { week, day, index|null }
    anchor: null,     // for Shift+click ranges
    clip: [],         // copied raw items (JSON strings)
    clipWeek: null,   // a copied week's days (JSON string), when the clipboard holds a week
    week: null,       // a selected whole week (index in file.weeks), or null
    pendingKey: null, // "d" / "y" waiting for its pair
    reveal: false,    // scroll the cursor into view after the next paint
    drag: null,
  };
  const sameRef = (a, b) => a && b && a.week === b.week && a.day === b.day && a.index === b.index;
  const columns = () => state.plan?.weeks ?? [];                       // sorted by date
  const colOf = weekIndex => columns().findIndex(w => w.index === weekIndex);
  const rawList = (ref, create = false) => {
    const w = state.file.weeks[ref.week];
    if (!w) return [];
    if (!w[ref.day]) { if (!create) return []; w[ref.day] = []; }
    return w[ref.day];
  };
  const rawAt = ref => rawList(ref)[ref.index];
  /** Where an object sits in the file now, by identity. */
  function findRef(obj) {
    const weeks = state.file.weeks ?? [];
    for (let w = 0; w < weeks.length; w++) for (const day of SLOTS) {
      const i = (weeks[w][day] ?? []).indexOf(obj);
      if (i >= 0) return { week: w, day, index: i };
    }

      const modes = new Set(ex.map(modeOf).filter(Boolean));
      const essential = [...new Set([...modes].flatMap(m => ESSENTIAL[m] ?? []))];
      const fields = new Map();
      const control = path => {
        const plans = ex.map(effectivePlan);
        const value = common(plans.map(p => path === "effort" && getPath(p, path) ? normEnum(getPath(p, path)) : getPath(p, path)));
        const el = path === "effort" ? select(EFFORTS) : number();
        fields.set(path, tracked(el, value));
        return field(LABEL[path], el);
      };
      const own = ex.filter(o => o.plan).length;
      rows.push(h("div", { class: "sub" }, "Plan" + (own ? ` (${own === ex.length ? "" : own + " of " + ex.length + " "}with their own plan this week)` : "")));
      essential.forEach(p => rows.push(...control(p)));
      const reset = checkbox(false);
      rows.push(...field("Back to the default plan", reset));
      body.append(form(...rows));
      const more = h("details", {}, h("summary", {}, "More fields"),
        form(...ALL_FIELDS.filter(p => !essential.includes(p)).flatMap(control)));
      body.append(more);
      apply.push(() => {
        ex.forEach(o => {
          if (reset.checked) { delete o.plan; return; }
          const changed = [...fields].filter(([, el]) => dirty(el));
          if (!changed.length) return;
          const p = clone(effectivePlan(o));
          changed.forEach(([path, el]) => {
            if (el.value === "\u0000") return;
            const v = path === "effort" ? (el.value || undefined) : num(el);
            setPath(p, path, v);
          });
          o.plan = tidy(p);
          if (!Object.keys(o.plan).length) delete o.plan;
        });
      });
    }
    if (groups.circuit.length) {
      const cs = groups.circuit;
      const rows = [h("div", { class: "sub" }, `Circuit${cs.length > 1 ? "s" : ""}`)];
      if (single) {
        const name = tracked(input("", { list: "names-circuit" }), single.circuit);
        rows.push(...field("Circuit", name));
        apply.push(() => { if (dirty(name) && name.value.trim()) single.circuit = name.value.trim(); });
      }
      const rounds = tracked(number(), common(cs.map(o => o.rounds)));
      rounds.placeholder = rounds.placeholder || "its own";
      rows.push(...field("Rounds this week", rounds));
      apply.push(() => { if (dirty(rounds)) cs.forEach(o => { if (num(rounds) != null) o.rounds = num(rounds); else delete o.rounds; }); });
      body.append(form(...rows));
    }
    if (groups.module.length) {
      const ms = groups.module;
      const rows = [h("div", { class: "sub" }, `Module${ms.length > 1 ? "s" : ""}`)];
      if (new Set(ms.map(o => nameKey(o.module))).size === 1) {
        if (single) {
          const name = tracked(input("", { list: "names-module" }), single.module);
          rows.push(...field("Module", name));
          apply.push(() => { if (dirty(name) && name.value.trim()) single.module = name.value.trim(); });
        }
        const omit = tracked(input(""), common(ms.map(o => (o.omit ?? []).join(", "))));
        rows.push(...field("Leave out (names)", omit));
        const plans = tracked(textarea(""), common(ms.map(o => o.plans ? JSON.stringify(o.plans, null, 2) : "")));
        rows.push(h("div", { class: "sub" }, "Plans this week, by exercise (JSON)"), h("div", { class: "span" }, plans));
        apply.push(() => {
          ms.forEach(o => {
            if (dirty(omit)) { const l = omit.value.split(",").map(x => x.trim()).filter(Boolean); if (l.length) o.omit = l; else delete o.omit; }
            if (dirty(plans)) { const p = jsonOf(plans, undefined); if (p && Object.keys(p).length) o.plans = p; else delete o.plans; }
          });
        });
      } else {
        rows.push(h("div", { class: "span muted" }, "Different modules: edit them one at a time to change what they leave out or plan."));
      }
      body.append(form(...rows));
    }
    if (groups.activity.length) {
      const as = groups.activity;
      const rows = [h("div", { class: "sub" }, `Activit${as.length > 1 ? "ies" : "y"}`)];
      if (single) {
        const name = tracked(input(""), single.activity);
        rows.push(...field("Name", name));
        apply.push(() => { if (dirty(name) && name.value.trim()) single.activity = name.value.trim(); });
      }
      const minutes = tracked(number(), common(as.map(o => o.minutes)));
      rows.push(...field("Minutes", minutes));
      apply.push(() => { if (dirty(minutes)) as.forEach(o => { if (num(minutes) != null) o.minutes = num(minutes); else delete o.minutes; }); });
      body.append(form(...rows));
    }
    if (single) {
      const extra = textarea(JSON.stringify(single, null, 2));
      const before = extra.value;
      body.append(h("details", { class: "json" }, h("summary", {}, "JSON"), extra));
      // Editing the JSON replaces the item outright; the fields above are then ignored.
      apply.unshift(() => {
        if (extra.value === before) return;
        const replaced = jsonOf(extra, single);
        Object.keys(single).forEach(k => delete single[k]);
        Object.assign(single, replaced);
        apply.length = 1;
      });
    }
    // Wide, not tall: two label-and-field pairs to a row.
    body.querySelectorAll(".form").forEach(f => f.classList.add("g2"));
    const title = single ? "Edit" : `Edit ${objs.length} items`;
    dialog(title, body, () => {
      // The edit happens on the live objects inside one change, so it undoes as one.
      const snapshot = JSON.stringify(state.file);
      try {
        state.past.push(snapshot); state.future = [];
        for (let i = 0; i < apply.length; i++) apply[i]();
      } catch (e) { state.file = JSON.parse(state.past.pop()); return e.message; }
      follow(objs);
      refresh();
    });
  }

  // ---------------------------------------------------------------- menus and help

      })()));
    document.body.append(m);
    const r = m.getBoundingClientRect();
    m.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
    m.style.top = Math.min(y, innerHeight - r.height - 8) + "px";

  }

      ["Cut", "Ctrl+X", cut], ["Copy", "Ctrl+C", copyToClipboard],
      ["Paste after", "Ctrl+V", () => paste(false), !board.clip.length], ["Paste before", "P", () => paste(true), !board.clip.length],
      "-",
      ["Copy to next week", "Shift+→", () => copySelection("right")],
      ["Move to next week", "Ctrl+→", () => moveSelection("right")],

      ["Delete", "Del", deleteSelection],
    ]);
  }

    const empty = !rawList(board.slot).length;

      ["Add…", "a", addHere],
      ["Paste", "Ctrl+V", () => paste(false), !board.clip.length],

      ["Clear this day", "Del", deleteSelection, empty],
    ]);
  }
  /** Moves the selection to any day of any week, in order, at the end. */
  function moveDialog() {
    const objs = selectedObjects(); if (!objs.length) return;
    const r = ordered()[0];
    const week = select(columns().map(w => [String(w.index), `Week of ${dayMonth(w.start)} ${w.start.getUTCFullYear()}`]), String(r.week));
    const day = select([["unscheduled", "Unscheduled"], ...DAYS.map((d, n) => [d, DAY_LABEL[n]])], r.day);
    dialog("Move to", form(...field("Week", week), ...field("Day", day)), () => {
      const to = { week: Number(week.value), day: day.value };

  }
  /** The keyboard, by where it applies. Keys only: what the mouse does is in plan-format.md. */

  function help() {
    dialog("Keys", h("div", { class: "keyhelp" }, KEYS.map(([section, rows]) => h("section", {},

  // ---------------------------------------------------------------- the page's events

  /** Marks a rendered card as a selectable item and gives it a drag handle. */
  function wrap(item, week, slot) {
    const node = itemNode(item);
    const ref = item.ref;
    node.classList.add("it");
    node.dataset.week = ref.week; node.dataset.day = ref.day; node.dataset.index = ref.index;
    node.tabIndex = -1;
    const grip = h("span", { class: "grip", title: "Drag to move, Shift+drag to copy" }, "⠿");
    (node.querySelector(".top") ?? node.querySelector(".mname") ?? node).prepend(grip);
    return node;
  }
  function refFromEl(el) {
    const it = el.closest?.(".it");
    if (it) return { week: +it.dataset.week, day: it.dataset.day, index: +it.dataset.index };
    return null;
  }
  function slotFromEl(el) {
    const s = el.closest?.(".slot");
    return s ? { week: +s.dataset.week, day: s.dataset.day } : null;
  }
  function onClick(e) {
    if (!state.editing || state.view !== "week") return;
    if (e.target.closest("button, input, select, textarea, a, .ctxmenu")) return;
    const ref = refFromEl(e.target);
    if (ref) {
      if (e.ctrlKey || e.metaKey) {
        const i = board.items.findIndex(r => sameRef(r, ref));
        const items = i >= 0 ? board.items.filter((_, k) => k !== i) : [...board.items, ref];
        board.anchor = ref; setSelection(items, ref, { reveal: false });
      } else if (e.shiftKey && board.anchor) {
        setSelection(rangeBetween(board.anchor, ref), ref, { reveal: false });
      } else {
        board.anchor = ref; setSelection([ref], ref, { reveal: false });
      }
      return;
    }
    const slot = slotFromEl(e.target);
    if (slot) { board.reveal = false; selectSlot(slot); return; }
    const head = e.target.closest(".whead[data-week]");
    if (head) selectWeek(+head.dataset.week, { reveal: false });
  }
  /** Every item between two refs, in plan order. */
  function rangeBetween(a, b) {
    const all = [];
    columns().forEach(w => SLOTS.forEach(day => (state.file.weeks[w.index][day] ?? []).forEach((_, index) => all.push({ week: w.index, day, index }))));
    const i = all.findIndex(r => sameRef(r, a)), j = all.findIndex(r => sameRef(r, b));
    if (i < 0 || j < 0) return [b];
    return all.slice(Math.min(i, j), Math.max(i, j) + 1);
  }
  function onDblClick(e) {
    if (!state.editing || state.view !== "week") return;
    const ref = refFromEl(e.target);
    if (ref) { if (!board.items.some(r => sameRef(r, ref))) setSelection([ref], ref); editSelection(); }
    else if (slotFromEl(e.target)) { selectSlot(slotFromEl(e.target)); addHere(); }
  }
  function weekMenu(x, y) {
    const i = board.week; const w = weekAt(i); if (!w) return;
    menu(x, y, [
      [w.deload ? "Not a deload week" : "Deload week", "q", () => toggleDeload(i)],
      [w.note ? "Edit the note…" : "Add a note…", "n", () => editNote(w)],
      "-",
      ["Copy week", "Ctrl+C", copyToClipboard],
      ["Paste week", "Ctrl+V", () => paste(false), !board.clipWeek],
      ["Copy to the next week", "Shift+→", () => copyWeekTo("right")],
      ["Copy to following weeks…", "", () => copyWeekDialog(w)],
      "-",
      ["Clear its workouts", "Del", deleteSelection],
      ["Delete the week", "Shift+Del", () => deleteWeek(i)],
    ]);
  }
  function onContextMenu(e) {
    if (!state.editing || state.view !== "week") return;
    const head = e.target.closest?.(".whead[data-week]");
    if (head) { e.preventDefault(); selectWeek(+head.dataset.week, { reveal: false }); weekMenu(e.clientX, e.clientY); return; }
    const ref = refFromEl(e.target);
    const slot = slotFromEl(e.target);
    if (!ref && !slot) return;
    e.preventDefault();
    if (ref) {
      if (!board.items.some(r => sameRef(r, ref))) { board.anchor = ref; setSelection([ref], ref, { reveal: false }); }
      itemMenu(e.clientX, e.clientY);
    } else {
      selectSlot(slot); slotMenu(e.clientX, e.clientY);
    }
  }

  const typing = t => t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  function onKey(e) {
    const ctrl = e.ctrlKey || e.metaKey;
    if (e.key === "Escape") {
      if (board.drag) { cancelDrag(); e.preventDefault(); return; }
      if (!document.querySelector("dialog[open]") && typing(e.target) && (state.view === "library" || state.view === "global")) {
        e.target.blur(); if (state.view === "library") focusList(); return;
      }
      if (state.view === "global" && globalPick && !document.querySelector("dialog[open]")) { globalPick = null; render(); return; }
      if (document.getElementById("ctxmenu")) { closeMenu(); return; }
      if (!document.querySelector("dialog[open]") && !typing(e.target) && board.items.length + (board.slot ? 1 : 0)) { clearSelection(); return; }
      return;
    }
    if (document.querySelector("dialog[open]") || typing(e.target)) return;
    // History and saving work in every view.
    if (ctrl && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (ctrl && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) { e.preventDefault(); redo(); return; }
    if (ctrl && e.key.toLowerCase() === "s") { e.preventDefault(); save(); return; }
    if (e.key === "?" && state.file) { e.preventDefault(); help(); return; }
    // ` or ~: between the weeks and the table (from the library, to the weeks).
    if ((e.key === "`" || e.key === "~") && state.file && !ctrl && !e.altKey) {
      e.preventDefault();
      state.view = state.view === "week" ? "global" : "week";
      render();
      return;
    }
    if (state.view === "library" && state.file && !ctrl && !e.altKey) { if (libraryKey(e)) return; }
    if (!state.editing || state.view !== "week" || !state.file) return;
    if (document.getElementById("ctxmenu")) return;

    const arrows = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", k: "up", j: "down", h: "left", l: "right" };
    const dir = arrows[e.key] ?? (e.shiftKey && arrows[e.key.toLowerCase()]);
    if (dir && !e.altKey && board.week != null) {
      // A selected week: Shift copies it across, plain ←/→ select the neighbouring week, ↑/↓ go into it.
      e.preventDefault();
      if (e.shiftKey && (dir === "left" || dir === "right")) copyWeekTo(dir);
      else if (!ctrl && (dir === "left" || dir === "right")) {
        const w = columns()[colOf(board.week) + (dir === "right" ? 1 : -1)];
        if (w) selectWeek(w.index);
      } else if (!ctrl && !e.shiftKey) goTo(stop(board.week, dir === "down" ? "monday" : "sunday", 0));
      return;
    }
    if (dir && !e.altKey) {
      e.preventDefault();
      if (ctrl) moveSelection(dir);
      else if (e.shiftKey) copySelection(dir);
      else { const c = startCursor(); if (c) goTo(board.cursor ? step(c, dir) : c); }
      return;
    }
    const pendingPair = (k, run) => {
      if (board.pendingKey === k && Date.now() - board.pendingAt < 800) { board.pendingKey = null; run(); }
      else { board.pendingKey = k; board.pendingAt = Date.now(); }
    };
    switch (e.key) {
      case "PageDown": e.preventDefault(); page("down"); return;
      case "PageUp": e.preventDefault(); page("up"); return;
      case "Home": case "End": {
        e.preventDefault();
        // First / last day of the week (Ctrl or not).
        const c = startCursor(); if (!c) return;
        goTo(stop(c.week, e.key === "Home" ? "monday" : "sunday", e.key === "Home" ? 0 : 1e9));
        return;
      }
      case "Enter": case "e": e.preventDefault(); editSelection(); return;
      case "a": e.preventDefault(); addHere(); return;
      case "Delete": case "Backspace":
        e.preventDefault();
        if (e.shiftKey && board.week != null) deleteWeek(board.week); else deleteSelection();
        return;
      case "?": e.preventDefault(); help(); return;
      case "w": e.preventDefault(); { const c = startCursor(); if (c) selectWeek(c.week); } return;
      case "q": e.preventDefault(); { const i = currentWeek(); if (i != null) toggleDeload(i); } return;
      case "n": e.preventDefault(); { const w = weekAt(currentWeek()); if (w) editNote(w); } return;
      case "[": e.preventDefault(); if (ctrl) jumpEnd(-1); else jumpDeload(-1); return;
      case "]": e.preventDefault(); if (ctrl) jumpEnd(1); else jumpDeload(1); return;
      case "{": e.preventDefault(); if (ctrl) jumpPhaseEdge(-1); else jumpPhase(-1); return;
      case "}": e.preventDefault(); if (ctrl) jumpPhaseEdge(1); else jumpPhase(1); return;
      case "p": if (!ctrl) { e.preventDefault(); paste(false); } return;
      case "P": if (!ctrl) { e.preventDefault(); paste(true); } return;
      case "d": if (!ctrl) pendingPair("d", cut); return;
      case "y": if (!ctrl) pendingPair("y", copyToClipboard); return;
    }
    if (ctrl && e.key.toLowerCase() === "x") { e.preventDefault(); cut(); }
    else if (ctrl && e.key.toLowerCase() === "c") { e.preventDefault(); copyToClipboard(); }
    else if (ctrl && e.key.toLowerCase() === "v") { e.preventDefault(); paste(false); }
  }

  // ---------------------------------------------------------------- dragging

  function onPointerDown(e) {
    if (!state.editing || e.button !== 0) return;
    const grip = e.target.closest(".grip"); if (!grip) return;
    const ref = refFromEl(grip); if (!ref) return;
    e.preventDefault();
    if (!board.items.some(r => sameRef(r, ref))) { board.anchor = ref; setSelection([ref], ref, { reveal: false }); }
    board.drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, started: false, copy: e.shiftKey, target: null, pointer: e.pointerId };
    try { grip.setPointerCapture(e.pointerId); } catch (x) { /* not a real pointer */ }
    grip.addEventListener("pointermove", onPointerMove);
    grip.addEventListener("pointerup", onPointerUp, { once: true });
    grip.addEventListener("pointercancel", cancelDrag, { once: true });
  }
  function onPointerMove(e) {
    const d = board.drag; if (!d) return;
    d.x = e.clientX; d.y = e.clientY; d.copy = e.shiftKey;
    if (!d.started) {
      if (Math.hypot(d.x - d.x0, d.y - d.y0) < 5) return;
      d.started = true;
      const n = board.items.length;
      const first = rawAt(ordered()[0]);
      const name = first ? (first.exercise ?? first.circuit ?? first.module ?? first.activity) : "";
      d.ghost = h("div", { class: "ghost" }, h("span", { class: "plus" }, "+"), n > 1 ? `${n} items` : name);
      document.body.append(d.ghost);
      d.line = h("div", { class: "dropline" });
      document.body.append(d.line);
      board.items.forEach(r => cardEl(r)?.classList.add("dragsrc"));
      d.loop = requestAnimationFrame(autoScroll);
    }
    trackTarget();
  }
  function trackTarget() {
    const d = board.drag; if (!d?.started) return;
    d.ghost.style.left = d.x + 14 + "px"; d.ghost.style.top = d.y + 10 + "px";
    d.ghost.classList.toggle("copy", d.copy);
    document.querySelectorAll(".slot.droptarget").forEach(el => el.classList.remove("droptarget"));
    const under = document.elementFromPoint(d.x, d.y);
    const slotNode = under?.closest(".slot");
    if (!slotNode) { d.target = null; d.line.style.display = "none"; return; }
    slotNode.classList.add("droptarget");
    const cards = [...slotNode.querySelectorAll(":scope > .it")];
    let index = cards.length;
    for (let i = 0; i < cards.length; i++) {
      const r = cards[i].getBoundingClientRect();
      if (d.y < r.top + r.height / 2) { index = i; break; }
    }
    d.target = { week: +slotNode.dataset.week, day: slotNode.dataset.day, index };
    const box = slotNode.getBoundingClientRect();
    const y = cards.length ? (index < cards.length ? cards[index].getBoundingClientRect().top - 3 : cards[cards.length - 1].getBoundingClientRect().bottom + 2)
      : box.top + 34;
    Object.assign(d.line.style, { display: "block", left: box.left + 8 + "px", width: box.width - 16 + "px", top: y + "px" });
  }
  function autoScroll() {
    const d = board.drag; if (!d?.started) return;
    const wrapEl = document.querySelector(".weeks");
    const edge = 48, speed = 18;
    let moved = false;
    if (wrapEl) {
      const r = wrapEl.getBoundingClientRect();
      if (d.x < r.left + edge) { wrapEl.scrollLeft -= speed; moved = true; }
      else if (d.x > r.right - edge) { wrapEl.scrollLeft += speed; moved = true; }
    }
    if (d.y < edge) { window.scrollBy(0, -speed); moved = true; }
    else if (d.y > innerHeight - edge) { window.scrollBy(0, speed); moved = true; }
    if (moved) trackTarget();
    d.loop = requestAnimationFrame(autoScroll);
  }
  function endDrag() {
    const d = board.drag; if (!d) return;
    cancelAnimationFrame(d.loop);
    d.ghost?.remove(); d.line?.remove();
    document.querySelectorAll(".dragsrc, .droptarget").forEach(el => el.classList.remove("dragsrc", "droptarget"));
    board.drag = null;
  }
  function cancelDrag() { endDrag(); }
  function onPointerUp(e) {
    const d = board.drag;
    e.currentTarget.removeEventListener("pointermove", onPointerMove);
    if (!d?.started || !d.target) { endDrag(); return; }
    const copy = d.copy || e.shiftKey;
    const target = d.target;
    const objs = selectedObjects();
    endDrag();
    edit(f => {
      if (copy) { const cs = objs.map(clone); insertAt(f, target, target.index, cs); return cs; }
      moveTo(f, objs, target, target.index);
      return objs;
    });
  }
  document.addEventListener("keydown", e => {
    if (board.drag?.started && e.key === "Shift") { board.drag.copy = true; trackTarget(); }
  });
  document.addEventListener("keyup", e => {
    if (board.drag?.started && e.key === "Shift") { board.drag.copy = false; trackTarget(); }
  });

  function restoreFocus() {
    if (!state.editing || state.view !== "week") return;
    board.reveal = false;
    paint();
    const c = board.cursor;
    const el = c ? (c.index != null ? cardEl(c) : slotEl(c)) : null;
    el?.focus?.({ preventScroll: true });
  }

  /** After the weeks are drawn: the selection back on the page. */
  function afterRender() { clampSelection(); paint(); }

  document.addEventListener("click", onClick);
  document.addEventListener("dblclick", onDblClick);
  document.addEventListener("contextmenu", onContextMenu);
  document.addEventListener("pointerdown", onPointerDown);
  document.addEventListener("keydown", onKey);
  document.addEventListener("mousedown", e => { if (!e.target.closest(".ctxmenu")) closeMenu(); });
  document.addEventListener("scroll", closeMenu, true);

  // ---------------------------------------------------------------- wiring

  document.getElementById("e-edit").onclick = () => { state.editing = !state.editing; render(); };
  document.getElementById("e-undo").onclick = undo;
  document.getElementById("e-redo").onclick = redo;
  document.getElementById("e-save").onclick = save;
  document.getElementById("e-new").onclick = newPlan;

  /** On an empty page, offers the draft left from last time. */
  function offerDraft(zone) {
    const d = readDraft();
    if (!d?.file) return;
    zone.append(h("div", { style: "margin-top:14px" },
      button(`Restore the unsaved draft (${d.name || "plan"}, ${new Date(d.at).toLocaleString()})`, restoreDraft)));
  }

  return { globalPanel, pickInGlobal, globalPicked: () => globalPick, button, wrap, addItem, addWeek, editPhases, renderLibrary, updateHeader, offerDraft, afterRender, restoreFocus };
})();

const dropZone = document.getElementById("drop");
Editor.updateHeader();
Editor.offerDraft(dropZone);
document.getElementById("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => load(f.name, t));
  e.target.value = "";
};
document.getElementById("v-week").onclick = () => { state.view = "week"; render(); };
document.getElementById("v-global").onclick = () => { state.view = "global"; render(); };
document.getElementById("v-library").onclick = () => { state.view = "library"; render(); };
document.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("over"); });
document.addEventListener("dragleave", () => dropZone.classList.remove("over"));
document.addEventListener("drop", e => {
  e.preventDefault(); dropZone.classList.remove("over");
  const f = e.dataTransfer.files[0]; if (f) f.text().then(t => load(f.name, t));
});
</script>
</body>
</html>
